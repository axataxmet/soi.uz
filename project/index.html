<style>/* corp/styles.css — scoped under .z-corp (auto) */

:root{
  /* Единственный блок токенов сайта; значения — по фирменному стилю
     «ИНДУСТРИЯ ЗДОРОВЬЯ» (design-system/soi.uz/PALETTE.md).

     Два цвета: белый фон и синий #0E4AC6 — он же структурный (заголовки,
     текст, иконки, линии, рамки) и он же сигнальный на главных действиях.
     Чёрного в палитре нет. Лайм #B8F500 был третьим цветом и снят целиком
     (решение заказчика 07.08.2026) — сначала с главной, теперь со всех
     страниц ради единого стиля.

     Имена --slate-*, --navy-*, --cyan-* сохранены: на них ссылаются сотни
     мест, переименование потребовало бы править их все разом. Работают
     оттенками того же синего. Уйдут вместе с этапом 7 ТЗ. */

  /* канон палитры */
  --accent:#0E4AC6; --accent-2:#0a3a9c;    /* структурный синий и его тёмный тон */
  /* Сигнальные токены сохранили имена --cta-*, но держат теперь синий: на них
     ссылается три десятка правил (кнопки, поиск, плитки каталога, футер), и
     переименование пришлось бы делать разом по всем. Значение одно с
     --accent — отдельного сигнального цвета на сайте больше нет. */
  --cta:#0E4AC6; --cta-hover:#0a3a9c;
  /* Фирменный синий для тёмных подложек — футера и герой-слайдов на тёмной
     теме. Сам #0E4AC6 на тёмном фоне даёт 2.27:1 и не читается; этот тон —
     7.06:1 на фоне футера. Нужен именно как акцент на тёмном, не как замена
     фирменного цвета. */
  --accent-on-dark:#7FA8F0;
  --danger:#e0492f; --danger-bg:#fdeeeb;   /* ошибки: вне фирменной пары,
                                              но сигнал об ошибке не может
                                              быть синим */
  --cta-ink:#FFFFFF;                       /* подпись на синем — белая, 7.46:1;
                                              прежде здесь был синий по лайму */
  --bg-soft:#F4F7FD;                       /* акцентные информационные блоки */
  --ink-soft:#33445E; --mute:#667085;
  --line-2:#E8EFFB;

  /* фон и поверхности — «воздух», 80% пространства */
  --bg:#FFFFFF; --bg-2:#F4F7FD; --surface:#FFFFFF;
  --line:#CAD6E4; --line-soft:#dfe6ef;

  /* Текст — единая сине-серая шкала (решение заказчика 07.08.2026: палитру
     текста пересматриваем ради единства всех страниц).

     Заменила тёмно-зелёную гамму (--ink был #0B2D25, вторичные — #5A736A и
     соседние). Зелёный не входил ни в одну версию фирменной палитры и спорил
     с синим #0E4AC6: рядом с ним подписи отдавали болотным. Новая шкала —
     нейтральный тёмный с синим подтоном, один род с фирменным цветом.

     Раньше главная жила на своих значениях (#17212B / #667085), остальные 16
     страниц — на зелёных. Теперь источник один, и локальные переопределения
     на главной больше не нужны.

     Контраст на белом проверен, все текстовые ступени проходят WCAG AA:
       --ink 15.7:1 · --ink-2 9.9:1 · --slate-700 7.3:1
       --slate-600 6.0:1 · --slate-500 4.9:1 · --slate-400 4.5:1

     --slate-400 специально держится у самого порога 4.5:1, а не светлее:
     страницы набирают им живой текст 14-15px (подписи к цифрам, лиды
     разделов — .clp-sub, .clp-stat-l и соседние), а не только декор. При
     первой сборке шкалы он был #8A97AB с контрастом 2.96:1, и этот текст
     переставал читаться.

     --slate-300 (1.86:1) — единственная ступень вне текста: границы,
     разделители, неактивные иконки. Набирать им текст нельзя. */
  --ink:#16233B; --ink-2:#33445E;
  --slate-700:#47576F; --slate-600:#55647C; --slate-500:#63718A; --slate-400:#6A7790; --slate-300:#B6BFCC;

  /* синяя шкала */
  --blue-700:#0a3a9c; --blue-600:#0E4AC6; --blue-500:#2b72e3; --blue-400:#4d8eee; --blue-50:#eaf2ff;
  /* Тёмная шкала — подложка футера и тёмных блоков. Сдвинута в тон фирменного
     #0E4AC6 (решение заказчика 07.08.2026: футер оставляем тёмным, цвет
     подобрать). Прежние значения были холоднее и жили сами по себе; теперь
     это затемнённый фирменный синий. Белый текст на --navy-900 даёт 16.9:1. */
  --navy-900:#0B1C3A; --navy-850:#0F2447; --navy-800:#143059; --navy-700:#1B3E6E;

  /* статусы. «В наличии» — лаймовая плашка с синей подписью (п.3 ТЗ);
     «под заказ» и «предзаказ» остаются нейтральными, чтобы лайм не потерял
     сигнальность от частого повторения. */
  --success:#0E4AC6; --success-bg:#eaf2ff; --amber:#b87213; --amber-bg:#faf0dc; --violet:#6454d4;
  /* Фирменный градиент — синий вместо снятого лайма. Держит те же две
     остановки, чтобы кнопки на нём (.btn-primary, .search-btn, плитки
     каталога) не потеряли объём. Подпись на нём — --cta-ink, теперь белая. */
  --grad-brand:linear-gradient(125deg,#0E4AC6 0%,#1657D8 100%);
  --grad-hero:linear-gradient(160deg,#FFFFFF 0%,#F4F7FD 45%,#eaf2ff 100%);

  /* шрифты. --sans и --serif — псевдонимы --font: обоими набран Montserrat,
     засечного начертания на сайте нет. Оставлены, чтобы не править разом
     все места вызова; уходят на этапе 7.

     Стек повторяет референс medcomp.ru: Montserrat, Helvetica, Arial.
     Helvetica и Arial здесь — подстраховка на случай, если основной шрифт
     не загрузился: обе метрически близки к Montserrat и есть в macOS и
     Windows соответственно, поэтому подмена не ломает вёрстку. */
  --font:"Montserrat",Helvetica,Arial,sans-serif;
  --mono:"Geist Mono","JetBrains Mono",ui-monospace,monospace;

  /* радиус */
  --r-sm:8px; --r:12px; --r-lg:16px; --r-xl:24px; --r-pill:999px;

  /* тень */
  --sh-sm:0 1px 2px rgba(11,31,58,.05), 0 1px 4px rgba(11,31,58,.04);
  --sh:0 2px 8px rgba(11,31,58,.06), 0 4px 16px rgba(11,31,58,.05);
  --sh-lg:0 8px 32px rgba(9,24,48,.1), 0 2px 8px rgba(9,24,48,.06);
  --sh-xl:0 20px 60px rgba(9,24,48,.14), 0 6px 20px rgba(9,24,48,.07);

  /* Шрифтовая шкала. Ступени выбраны по фактическим пикам употребления, а не
     умозрительно: сайт набран плотной сеткой 11…18 и редкими крупными
     заголовками. При таком выборе 90% из 777 кеглей сдвинулись не более чем
     на 1 px, максимальный сдвиг — 2 px. Всё, что крупнее 40 px, оставлено
     как есть: это единичные заголовки экранов. */
  /* Нижняя ступень поднята с 11 до 12px: на ней набраны надзаголовки, теги
     кейсов, суммы и дисклеймер — 93 места по проекту, и все они нарушали
     правило «тело текста не мельче 12px». Правим ступень, а не каждое место:
     иначе следующий компонент снова возьмёт --fs-1 и вернёт 11px.
     Ступень совпала с --fs-2 намеренно — 11px в шкале больше нет. */
  --fs-1:12px; --fs-2:12px; --fs-3:13px; --fs-4:14px; --fs-5:16px;
  --fs-6:18px; --fs-7:22px; --fs-8:28px; --fs-9:38px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;
  --sp-5:24px; --sp-6:32px; --sp-7:48px; --sp-8:64px;

  --maxw:1280px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--surface);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.55;overflow-x:hidden}
.z-corp .cat-frame-wrap{width:100%;max-width:100vw;overflow:hidden}
.z-corp .cat-frame-wrap iframe{width:100%;max-width:100%;border:0}
a{color:inherit;text-decoration:none;cursor:pointer}
img{max-width:100%;display:block}
.z-corp .wrap{max-width:var(--maxw);margin:0 auto;padding:0 32px}
.z-corp .serif{font-family:var(--font)}
.z-corp .eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:var(--fs-2);font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--blue-600);background:var(--blue-50);border:1px solid var(--line-soft);padding:6px 14px;border-radius:99px}
.z-corp .eyebrow.line{background:none;border:none;padding:0}
.z-corp .eyebrow.line::before{content:"";width:26px;height:2px;background:var(--blue-600)}
.z-corp .h-sec{font-family:var(--font);font-size:var(--fs-9);line-height:1.12;font-weight:800;letter-spacing:-.02em;color:var(--navy-900)}
.z-corp .sub-sec{font-size:var(--fs-5);color:var(--slate-600);margin-top:14px;max-width:600px;line-height:1.6}
.z-corp .section{padding:84px 0}
.z-corp .section.alt{background:var(--bg)}


/* Набор кнопок вынесен в единый канонический блок ниже по файлу. */


.z-corp .uhead{background:var(--surface)}
.z-corp .uhead .wrap{display:flex;align-items:center;gap:10px;height:38px;font-size:var(--fs-2);color:var(--slate-500)}
.z-corp .uhead .u-sp{flex:1}
.z-corp .uhead .u-it{display:inline-flex;align-items:center;gap:6px}
/* catalog: corporate menu in the top utility row */
.z-corp .uhead-nav{display:flex;align-items:center;gap:1px;min-width:0;flex-wrap:nowrap}
.z-corp .uhead-nav a{padding:5px 9px;border-radius:var(--r-sm);font-size:var(--fs-2);font-weight:600;color:var(--slate-600,var(--mute));white-space:nowrap;cursor:pointer;transition:.14s;font-family:var(--font)}
.z-corp .uhead-nav a:hover{color:var(--blue-600);background:var(--blue-50)}
.z-corp .uhead-nav a.on{color:var(--blue-700);background:var(--blue-50);font-weight:700}
.z-corp .uhead-nav a:focus-visible{outline:2px solid var(--blue-500);outline-offset:1px}
.z-corp .uh-more{position:relative;display:none}
.z-corp .uh-more-btn{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border:none;border-radius:var(--r-sm);background:transparent;font-size:var(--fs-2);font-weight:700;color:var(--slate-600,var(--mute));cursor:pointer;font-family:var(--font);transition:.14s}
.z-corp .uh-more-btn:hover{color:var(--blue-600);background:var(--blue-50)}
.z-corp .uh-more-arr{font-size:var(--fs-1);line-height:1}
.z-corp .uh-more-ov{position:fixed;inset:0;z-index:125}
.z-corp .uh-more-menu{position:absolute;top:calc(100% + 6px);left:0;z-index:126;display:flex;flex-direction:column;gap:1px;min-width:170px;padding:7px;background:var(--surface,#fff);border:1px solid var(--line-soft,var(--line-soft));border-radius:var(--r);box-shadow:var(--sh-lg)}
.z-corp .uh-more-menu a{padding:8px 12px;border-radius:var(--r-sm);font-size:var(--fs-3);font-weight:600;color:var(--slate-600,var(--mute));white-space:nowrap;cursor:pointer;transition:.13s}
.z-corp .uh-more-menu a:hover{color:var(--blue-600);background:var(--blue-50)}
.z-corp .uh-more-menu a.on{color:var(--blue-700);background:var(--blue-50);font-weight:700}
[data-theme="dark"] .z-corp .uhead-nav a:hover,[data-theme="dark"] .z-corp .uh-more-btn:hover,[data-theme="dark"] .z-corp .uh-more-menu a:hover{background:#16273f}
[data-theme="dark"] .z-corp .uhead-nav a.on,[data-theme="dark"] .z-corp .uh-more-menu a.on{background:#16273f;color:var(--blue-400)}
[data-theme="dark"] .z-corp .uh-more-menu{background:#0c1726;border-color:#1c2c44}
@media(max-width:1080px){
  .z-corp .uhead-cat .uh-extra{display:none}
  .z-corp .uhead-cat .uh-more{display:block}
}
@media(max-width:980px){
  .z-corp .uhead-cat .uhead-nav{display:none}
}

/* ===== зона нажатия ==========================================================
   Норма для пальца — 44×44 px. Часть органов управления меньше: бургер и
   кнопки шапки 40-42, иконки соцсетей 34. Увеличивать сами элементы нельзя —
   поедет вёрстка шапки и футера, поэтому расширяем только область нажатия
   прозрачным псевдоэлементом. Внешне ничего не меняется, попасть пальцем
   становится можно.

   inset считается от текущего размера: -5px вокруг 34px даёт 44. */
.z-corp .burger, .z-corp .co-act, .z-corp .foot-soc,
.z-corp .theme-btn, .z-corp .co-nav .nav-dd-btn, .z-corp .lang-dd-btn { position:relative; }
.z-corp .burger::after, .z-corp .co-act::after, .z-corp .foot-soc::after,
.z-corp .theme-btn::after, .z-corp .co-nav .nav-dd-btn::after, .z-corp .lang-dd-btn::after {
  content:""; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:100%; min-width:44px; height:44px; border-radius:inherit; }

/* ===== light minimalist footer (corp shell) ===== */
.z-corp .foot{background:var(--surface);color:var(--slate-600);padding:0;font-size:var(--fs-4)}
.z-corp .foot .wrap{padding-top:0;padding-bottom:0}
/* Расстановка по образцу заказчика (06.08.2026): бренд + описание + контакты
   одной колонкой слева, между ними колонки навигации, справа — соцсети и под
   ними реквизиты за тонкой линией. Первая колонка шире прочих, потому что
   несёт три блока; последняя фиксированной доли, чтобы иконки соцсетей не
   разъезжались. Средних колонок две — «О компании» и «Каталог» (группу
   «Услуги» из футера убрали, см. footerNavCols). Через repeat(auto-fit,…)
   это записать нельзя: auto-repeat запрещён рядом с fr-треками, и браузер
   отбрасывает всё объявление целиком. Появится ещё одна группа — её
   подхватит grid-auto-columns, сетка не развалится. */
.z-corp .foot .fcols{grid-template-columns:1.5fr repeat(2,.95fr) 1.7fr;grid-auto-columns:1fr;gap:40px 36px;padding:64px 0 40px;align-items:start}
.z-corp .foot .f-brand{display:flex;align-items:center;gap:11px;margin-bottom:16px}
.z-corp .foot .f-wordmark{font-size:var(--fs-5);font-weight:800;letter-spacing:-.01em;color:var(--ink)}
.z-corp .foot .fabout{color:var(--slate-600);max-width:320px;margin:0 0 22px}
.z-corp .foot .cb-phone{color:var(--ink)!important}
.z-corp .foot h5{color:var(--ink)}
.z-corp .foot ul a{color:var(--slate-600)}
.z-corp .foot ul a:hover{color:var(--blue-600)}
/* Контакты: иконка в своей колонке, текст во второй — многострочный блок
   телефонов выравнивается по левому краю, а не съезжает под иконку. */
.z-corp .foot .foot-contact{display:flex;flex-direction:column;gap:13px}
.z-corp .foot .foot-contact li{color:var(--slate-600);font-size:var(--fs-4);line-height:1.5;display:grid;grid-template-columns:16px 1fr;gap:10px;align-items:start}

/* Правая колонка: заголовок, соцсети, копирайт под ними. */
.z-corp .foot .fcol-follow .foot-socials{margin-bottom:20px}
/* text-wrap:pretty не даёт «Все права / защищены.» и подобным коротким
   хвостам оставаться на отдельной строке в узкой колонке. */
.z-corp .foot .foot-copy{font-size:var(--fs-2);line-height:1.6;color:var(--slate-500);margin:0;text-wrap:pretty}
.z-corp .foot .fc-map{display:inline-flex;align-items:center;gap:6px;color:var(--blue-600);font-weight:600;cursor:pointer}

/* Контакты в тёмной теме: цвета заданы литералами, а не токенами.
   Причина — во втором блоке [data-theme="dark"] ниже по файлу цепочка
   псевдонимов схлопывается: --navy-800 → --navy-900 → #040c18, затем
   --line → --navy-800 и --ink → --line. В итоге текст, рамка и фон
   получают один и тот же цвет, и содержимое карточки исчезает.
   Тот же приём уже применён выше к .h-sec (color:#eef3fa).
   Сам дефект темы общий для сайта и лечится отдельно. */
