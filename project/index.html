<style>/* corp/styles.css — scoped under .z-corp (auto) */

:root{
  --blue-700:#0a3a9c; --blue-600:#0E4AC6; --blue-500:#2b72e3; --blue-400:#4d8eee; --blue-50:#eaf2ff;
  --cyan-600:#0d96be; --cyan-500:#14A7E5; --cyan-400:#36c5ec;
  --navy-900:#071A33; --navy-850:#0b1f3a; --navy-800:#0d2650; --navy-700:#123565;

  --line:#CAD6E4; --line-soft:#dfe6ef; --bg:#F5F8FC; --bg-2:#edf2f8; --surface:#ffffff;
  --success:#0f9960; --success-bg:#e6f5ee;

  --maxw:1280px;

  --sh:0 2px 8px rgba(11,31,58,.06), 0 4px 16px rgba(11,31,58,.05);
  --sh-lg:0 8px 32px rgba(9,24,48,.1), 0 2px 8px rgba(9,24,48,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--surface);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.55;overflow-x:hidden}
.z-corp .cat-frame-wrap{width:100%;max-width:100vw;overflow:hidden}

a{color:inherit;text-decoration:none;cursor:pointer}

.z-corp .sub-sec{font-size:16.5px;color:var(--slate-600);margin-top:14px;max-width:600px;line-height:1.6}
.z-corp .section{padding:84px 0}

.z-corp .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:700;height:44px;padding:0 22px;border-radius:10px;border:none;cursor:pointer;transition:transform .14s cubic-bezier(.16,1,.3,1),box-shadow .18s,filter .18s,background .18s,border-color .18s;white-space:nowrap;font-family:inherit;letter-spacing:.01em}
.z-corp .btn:active{transform:translateY(0) scale(.97)}
.z-corp .btn-pri{background:linear-gradient(125deg,#0E4AC6 0%,#15aed8 100%);color:#fff;box-shadow:0 4px 14px rgba(23,87,200,.25)}
.z-corp .btn-pri:hover{filter:brightness(1.05);transform:translateY(-1px);box-shadow:0 6px 20px rgba(23,87,200,.32)}
.z-corp .btn-ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.z-corp .btn-ghost:hover{border-color:var(--blue-400);color:var(--blue-600);background:var(--bg)}
.z-corp .btn-lg{height:52px;padding:0 30px;font-size:15.5px}
.z-corp .btn-white{background:#fff;color:var(--blue-700)}
.z-corp .btn-white:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,.18)}


.z-corp .uhead{border-bottom:1px solid var(--line-soft);background:var(--surface)}

.z-corp .uh-more-btn:hover{color:var(--blue-600,#0E4AC6);background:var(--blue-50,#eaf2ff)}
.z-corp .uh-more-arr{font-size:9px;line-height:1}

.z-corp .uh-more-menu{position:absolute;top:calc(100% + 6px);left:0;z-index:126;display:flex;flex-direction:column;gap:1px;min-width:170px;padding:7px;background:var(--surface,#fff);border:1px solid var(--line-soft,#e3eaf3);border-radius:11px;box-shadow:0 12px 32px rgba(9,24,48,.14)}
.z-corp .uh-more-menu a{padding:8px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--slate-600,#56657d);white-space:nowrap;cursor:pointer;transition:.13s}
.z-corp .uh-more-menu a:hover{color:var(--blue-600,#0E4AC6);background:var(--blue-50,#eaf2ff)}
.z-corp .uh-more-menu a.on{color:var(--blue-700,#0a3a9c);background:var(--blue-50,#eaf2ff);font-weight:700}
[data-theme="dark"] .z-corp .uhead-nav a:hover,[data-theme="dark"] .z-corp .uh-more-btn:hover,[data-theme="dark"] .z-corp .uh-more-menu a:hover{background:#16273f}

[data-theme="dark"] .z-corp .uh-more-menu{background:#0c1726;border-color:#1c2c44}

<style>/* ===== UzMedEx design system ===== */
:root{

  --line:#CAD6E4; --line-soft:#dfe6ef; --bg:#F5F8FC; --bg-2:#edf2f8; --surface:#ffffff;
  --success:#0f9960; --success-bg:#e6f5ee; --amber:#b87213; --amber-bg:#faf0dc; --violet:#6454d4;
  --r-sm:8px; --r:12px; --r-lg:16px; --r-xl:24px;
  --sh-sm:0 1px 2px rgba(11,31,58,.05), 0 1px 4px rgba(11,31,58,.04);

  --sh-lg:0 8px 32px rgba(9,24,48,.1), 0 2px 8px rgba(9,24,48,.06);

  --maxw:1280px;
  --grad-brand:linear-gradient(125deg,#0E4AC6 0%,#15aed8 100%);
  --grad-hero:linear-gradient(160deg,#f8fbff 0%,#ebf3fd 45%,#e3eef9 100%);
  --font:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"Geist Mono","JetBrains Mono",ui-monospace,monospace;
}

html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%}

  outline:2.5px solid var(--blue-500);outline-offset:2px}

  .cat-grid-p > .card,.grid-4 > .card{animation:cardCascade .5s cubic-bezier(.16,1,.3,1) backwards}

.search{flex:1;display:flex;align-items:center;background:var(--bg);border:1.5px solid var(--line);border-radius:var(--r);height:48px;padding:0 6px 0 16px;transition:.15s}
.search:focus-within{background:#fff;border-color:var(--blue-500);box-shadow:0 0 0 3px rgba(23,87,200,.1)}
.search svg{color:var(--slate-500);flex-shrink:0}
.search input{flex:1;border:none;background:none;outline:none;font-size:15px;padding:0 12px;color:var(--ink)}
.search input::placeholder{color:var(--slate-400)}
.search-btn{background:var(--grad-brand);color:#fff;font-weight:700;font-size:14px;height:36px;padding:0 20px;border-radius:8px;flex-shrink:0;letter-spacing:.01em}
.head-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.hact{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:64px;height:64px;color:var(--slate-400);border-radius:12px;font-size:10.5px;font-weight:700;transition:.15s;letter-spacing:.02em;flex-shrink:0}
.hact:hover{color:var(--blue-600);background:var(--bg-2)}
.hact.has-items{color:var(--blue-600)}
.hact.has-items:hover{color:var(--blue-700)}
.hact .cnt{position:absolute;top:8px;right:4px;min-width:18px;height:18px;padding:0 4px;background:var(--blue-600);color:#fff;border-radius:999px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;font-family:var(--mono);border:2px solid var(--surface);line-height:1;pointer-events:none}

/* ===== nav / catalog button ===== */
.nav{background:rgba(255,255,255,.98);border-bottom:1px solid #dfe9f5;position:sticky;top:80px;z-index:55}
.nav .wrap{display:flex;align-items:center;gap:10px;height:60px;position:relative}
.cat-btn{display:flex;align-items:center;gap:9px;background:#0E4AC6;color:#fff;font:800 14px/1 "DM Sans",var(--sans),system-ui,sans-serif;height:44px;padding:0 18px;border:1px solid #0E4AC6;border-radius:10px;box-shadow:0 10px 24px rgba(14,74,198,.14);white-space:nowrap;cursor:pointer}
.cat-btn svg{color:#fff}
.cat-btn:hover{background:#0a3a9c;border-color:#0a3a9c;box-shadow:0 12px 28px rgba(14,74,198,.18)}
.cat-btn.open{background:#0a3a9c;border-color:#0a3a9c}
.nav-links{display:flex;gap:2px;margin-left:4px}
.nav-links{display:flex;align-items:center;gap:6px;min-width:0}
.nav-links a{height:42px;display:inline-flex;align-items:center;padding:0 13px;border:1px solid transparent;border-radius:10px;font:700 14px/1 "DM Sans",var(--sans),system-ui,sans-serif;color:#334155;white-space:nowrap;cursor:pointer;transition:background .14s,color .14s,border-color .14s,transform .14s}
.nav-links a:hover{color:#0a3a9c;background:#f3f8ff;border-color:#d4e5fb}
.nav-links a.accent{color:var(--cyan-600)}
.ubar-links a.ubar-tenders{display:inline-flex;align-items:center;gap:6px;color:var(--cyan-600);font-weight:700}
.ubar-badge{font-size:9px;font-weight:800;letter-spacing:.03em;line-height:1;color:#fff;background:linear-gradient(120deg,var(--blue-600),var(--cyan-500));padding:2px 5px;border-radius:4px;text-transform:uppercase}
.nav-links a.nav-tenders{display:inline-flex;align-items:center;gap:7px;color:var(--cyan-600);font-weight:700}
.nav-links a.nav-tenders:hover{background:#e9f8fd;color:var(--cyan-600)}
.nav-badge{font-size:9.5px;font-weight:800;letter-spacing:.04em;line-height:1;color:#fff;background:linear-gradient(120deg,var(--blue-600),var(--cyan-500));padding:3px 5px;border-radius:5px;text-transform:uppercase}
.nav-spacer{flex:1}
/* "Ещё" dropdown */
.nav-more-wrap{position:relative;display:inline-flex}
.nav-more-btn{height:42px;display:inline-flex;align-items:center;gap:6px;padding:0 13px;border:1px solid transparent;border-radius:10px;font:700 14px/1 "DM Sans",var(--sans),system-ui,sans-serif;color:#334155;background:transparent;cursor:pointer;white-space:nowrap;transition:color .14s,background .14s,border-color .14s,transform .14s}
.nav-more-btn:hover,.nav-more-btn.open{color:#0a3a9c;background:#f3f8ff;border-color:#d4e5fb}
.nav-more-btn.open svg{transform:rotate(180deg)}
.nav-more-btn svg{transition:transform .16s}
.nav-more-btn:focus-visible{outline:2px solid var(--blue-400);outline-offset:2px}
.nav-more-dd{position:absolute;top:calc(100% + 8px);left:0;z-index:300;min-width:216px;background:#fff;border:1px solid rgba(15,23,42,.10);border-radius:12px;box-shadow:0 18px 48px rgba(9,24,48,.16);padding:7px;animation:navDdFade .15s ease}
.nav-more-item{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:9px;border:none;background:transparent;font-size:14px;font-weight:700;color:#334155;cursor:pointer;transition:color .12s,background .12s}
.nav-more-item:hover{color:#0a3a9c;background:#f3f8ff}
.nav-more-item.on{color:#0a3a9c;background:#eaf2ff}
.nav-more-item:focus-visible{outline:2px solid var(--blue-400);outline-offset:-2px}
/* active states for main nav links */
.nav-links a:focus-visible{outline:2px solid var(--blue-400);outline-offset:2px}
.nav-links a:active{transform:scale(.96)}

/* ===== mega menu ===== */
.mega-ov{position:fixed;inset:0;background:rgba(9,24,48,.28);z-index:90;animation:fade .15s}
.mega{position:absolute;left:0;right:0;top:0;margin:0 auto;max-width:var(--maxw);max-height:100%;overflow-y:auto;background:#fff;box-shadow:0 24px 60px rgba(9,24,48,.12),0 4px 12px rgba(9,24,48,.06);border-radius:0 0 16px 16px}
.mega-inner{max-width:var(--maxw);margin:0 auto;display:grid;grid-template-columns:300px 1fr;min-height:360px}
.mega-list{padding:16px 12px;border-right:1px solid var(--line);background:var(--bg)}
.mega-list-scroll{max-height:440px;overflow-y:auto}
.mega-subs{max-height:300px;overflow-y:auto}
.mega-li{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:10px;cursor:pointer;color:var(--slate-700);font-weight:600;font-size:14px}
.mega-li .mli-ic{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);color:var(--blue-600);flex-shrink:0}
.mega-li:hover,.mega-li.on{background:#fff;color:var(--blue-700);box-shadow:var(--sh-sm)}
.mega-li.on .mli-ic{background:var(--grad-brand);color:#fff;border-color:transparent}
.mega-li .chev{margin-left:auto;color:var(--slate-400)}
.mega-panel{padding:26px 32px}
.mega-panel h4{margin:0 0 5px;font-size:18px;font-weight:800}
.mega-panel .mp-sub{color:var(--slate-500);font-size:13px;margin-bottom:20px}
.mega-subs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 22px;max-width:600px}
.mega-sub{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;border-radius:9px;color:var(--slate-700);font-weight:600;font-size:13.5px;border:1px solid transparent}
.mega-sub:hover{background:var(--bg);border-color:var(--line);color:var(--blue-700)}
.mega-sub .ct{font-family:var(--mono);font-size:11.5px;color:var(--slate-400)}
.mega-cta{margin-top:22px;display:flex;align-items:center;gap:13px;background:linear-gradient(115deg,#eaf3fd,#dbeafb);border:1px solid #d0e4f8;color:var(--ink);border-radius:14px;padding:16px 20px;max-width:600px}
.mega-cta .mc-t{font-weight:700}
.mega-cta .mc-d{font-size:13px;color:var(--slate-500)}
.mega-cta .btn{margin-left:auto}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ===== buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14px;height:44px;padding:0 22px;border-radius:10px;transition:.14s;white-space:nowrap;letter-spacing:.01em}
.btn svg{flex-shrink:0}
.btn-primary{background:var(--grad-brand);color:#fff;box-shadow:0 4px 14px rgba(23,87,200,.25)}
.btn-primary:hover{filter:brightness(1.05);transform:translateY(-1px);box-shadow:0 6px 20px rgba(23,87,200,.32)}
.btn-dark{background:var(--navy-850);color:#fff}
.btn-dark:hover{background:var(--navy-700)}
.btn-ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn-ghost:hover{border-color:var(--blue-400);color:var(--blue-600);background:var(--bg)}
.btn-cyan{background:var(--cyan-500);color:#03202e}
.btn-cyan:hover{background:var(--cyan-400)}
.btn-lg{height:52px;font-size:15px;padding:0 28px}
.btn-block{width:100%}
.btn-light{background:rgba(255,255,255,.14);color:#fff;border:1.5px solid rgba(255,255,255,.22)}
.btn-light:hover{background:rgba(255,255,255,.22)}

/* ===== PREMIUM MICRO-DETAILS ===== */
/* tactile press feedback on all interactive controls */
.btn{transition:transform .14s cubic-bezier(.16,1,.3,1),box-shadow .18s,filter .18s,background .18s,border-color .18s}
.btn:active{transform:translateY(0) scale(.97)}
/* ===== universal disabled + loading states (crit. 10) ===== */
.btn:disabled,.btn[disabled],.btn-buy:disabled,.pdp-icact:disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.2);transform:none!important;box-shadow:none!important;pointer-events:none}
.btn.is-loading,.btn[aria-busy="true"]{color:transparent!important;pointer-events:none;position:relative}
.btn.is-loading::after,.btn[aria-busy="true"]::after{content:"";position:absolute;top:50%;left:50%;width:17px;height:17px;margin:-8.5px 0 0 -8.5px;border-radius:50%;border:2.5px solid rgba(255,255,255,.45);border-top-color:#fff;animation:btnspin .6s linear infinite}
.btn-buy.is-loading::after,.btn-ghost.is-loading::after,.btn-white.is-loading::after{border-color:rgba(23,87,200,.3);border-top-color:var(--blue-600)}
@keyframes btnspin{to{transform:rotate(360deg)}}
/* form field error state */
.field input.invalid,.field textarea.invalid,.field input:invalid:not(:placeholder-shown),.hf-input.invalid{border-color:var(--danger,#d6453a)!important;box-shadow:0 0 0 3px rgba(214,69,58,.12)!important}
.field-err{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--danger,#d6453a);font-weight:600;margin-top:6px}
.field-err::before{content:"!";display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--danger,#d6453a);color:#fff;font-size:10px;font-weight:800;flex-shrink:0}
.btn-primary:active{filter:brightness(.98);box-shadow:0 2px 8px rgba(23,87,200,.22)}
.btn-buy:active,.tool:active,.pdp-icact:active,.hact:active,.flt-trigger:active,.nc:active,.brand-chip:active{transform:scale(.95)}
.cat-btn{transition:transform .14s cubic-bezier(.16,1,.3,1),background .18s,box-shadow .18s}
.cat-btn:active{transform:scale(.97)}
/* primary CTA: a touch more presence + animated sheen on hover */
.btn-primary{position:relative;overflow:hidden}
.btn-primary::before{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-18deg);transition:left .55s cubic-bezier(.16,1,.3,1);pointer-events:none}
.btn-primary:hover::before{left:140%}
/* product card: gentle image zoom + smoother lift */
.card{transition:transform .22s cubic-bezier(.16,1,.3,1),box-shadow .22s,border-color .22s}
.card .card-media .ph{transition:transform .4s cubic-bezier(.16,1,.3,1)}
.card:hover .card-media .ph{transform:scale(1.045)}
/* category tile icon + lift easing */
.cat-tile,.hc-tile,.brand-chip,.dir-card{transition:transform .2s cubic-bezier(.16,1,.3,1),box-shadow .2s,border-color .2s}
/* keyboard accessibility: visible focus ring on every interactive element */
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chk:focus-visible,.card-title:focus-visible{outline:2px solid var(--blue-500);outline-offset:2px;border-radius:6px}
.btn:focus-visible,.btn-primary:focus-visible{outline:2px solid var(--blue-700);outline-offset:3px}
/* sticky header: deepen shadow once the page is scrolled */
.head{transition:box-shadow .25s ease,background .25s ease}
.head.scrolled{box-shadow:0 1px 0 var(--line),0 8px 28px rgba(9,24,48,.1)}
/* active nav link highlight */
.nav-links a.on{background:var(--bg-2);color:var(--blue-700);font-weight:700}

/* ===== badges / stock / price ===== */
.bdg{display:inline-flex;align-items:center;font-size:11px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:4px 9px;border-radius:6px;color:#fff}
.bdg-hit{background:var(--blue-600)}
.bdg-new{background:var(--cyan-500);color:#052232}
.bdg-sale{background:#e0492f}
.stk{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700}
.stk-dot{width:7px;height:7px;border-radius:999px}
.stk-in{color:var(--success)}.stk-in .stk-dot{background:var(--success)}
.stk-order{color:var(--amber)}.stk-order .stk-dot{background:var(--amber)}
.stk-pre{color:var(--slate-500)}.stk-pre .stk-dot{background:var(--slate-400)}
.price-now{font-weight:800;color:var(--ink);letter-spacing:-.01em;white-space:nowrap}
.price-cur{font-weight:600;color:var(--slate-500);font-size:.7em}
.price-old{color:var(--slate-400);text-decoration:line-through;font-size:13px;margin-top:2px}
.price-sm .price-now{font-size:18px}
.price-md .price-now{font-size:22px}
.price-lg .price-now{font-size:32px}

/* ===== qty stepper ===== */
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.qty button{width:40px;height:42px;display:flex;align-items:center;justify-content:center;color:var(--slate-600)}
.qty button:hover{background:var(--bg-2);color:var(--blue-600)}
.qty input{width:46px;height:42px;text-align:center;border:none;outline:none;font-weight:700;font-size:15px;font-family:var(--mono)}
.qty-sm button{width:34px;height:36px}.qty-sm input{width:38px;height:36px;font-size:14px}

/* ===== placeholder ===== */
.ph{position:relative;width:100%;aspect-ratio:4/3;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.ph-big{aspect-ratio:1/1}
.ph-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(20,58,107,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(20,58,107,.05) 1px,transparent 1px);background-size:22px 22px;opacity:.7}
.ph-glyph{position:relative;opacity:.9;filter:drop-shadow(0 4px 8px rgba(14,42,82,.1))}
.ph-photo img{width:100%;height:100%;object-fit:contain;display:block}
.ph-meta{position:absolute;left:12px;right:12px;bottom:11px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.ph-brand{font-size:11px;font-weight:800;color:var(--slate-600);background:rgba(255,255,255,.78);padding:3px 8px;border-radius:6px;backdrop-filter:blur(4px)}
.ph-type{font-size:10.5px;color:var(--slate-500);background:rgba(255,255,255,.6);padding:3px 7px;border-radius:6px}

/* ===== product card ===== */
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px;display:flex;flex-direction:column;transition:.18s}
.card:hover{box-shadow:var(--sh-xl);border-color:rgba(23,87,200,.12);transform:translateY(-4px)}
.card-badges{position:absolute;top:18px;left:18px;z-index:2;display:flex;gap:6px}
.card-tools{position:absolute;top:16px;right:16px;z-index:2;display:flex;flex-direction:column;gap:6px;opacity:0;transform:translateX(6px);transition:.16s}
.card:hover .card-tools{opacity:1;transform:none}
/* touch devices: no hover → always show tools so wishlist/compare are reachable */
@media (hover:none){.card-tools{opacity:1;transform:none}}
.tool{width:36px;height:36px;border-radius:9px;background:#fff;border:1px solid var(--line);color:var(--slate-600);display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-sm)}
.tool:hover{color:var(--blue-600);border-color:var(--blue-500)}
.tool.on{background:var(--blue-600);color:#fff;border-color:transparent}
.card-media{cursor:pointer}
.card-body{display:flex;flex-direction:column;gap:9px;padding:14px 6px 6px}
.card-meta{display:flex;align-items:center;justify-content:space-between}
.card-sku{font-size:11.5px;color:var(--slate-400)}
.card-title{font-size:14.5px;font-weight:700;line-height:1.35;margin:0;cursor:pointer;color:var(--ink);min-height:40px;text-wrap:pretty}
.card-title:hover{color:var(--blue-600)}
.card-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:auto;padding-top:6px}
.card-b2b{display:flex;flex-wrap:wrap;gap:10px;margin-top:2px}
.cb2b-it{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--slate-500)}
.cb2b-it svg{flex-shrink:0}
.card-foot-btns{display:flex;gap:6px;align-items:center}
.btn-kp{display:inline-flex;align-items:center;gap:5px;background:var(--blue-600,#1a5fd0);color:#fff;font-weight:700;font-size:13px;height:38px;padding:0 12px;border-radius:9px;transition:.14s;border:1px solid transparent;cursor:pointer;font-family:inherit}
.btn-kp:hover{background:var(--blue-700,#13469a)}
[data-density="compact"] .card-b2b{gap:7px}
[data-density="compact"] .cb2b-it{font-size:11px}
.btn-buy{display:inline-flex;align-items:center;gap:7px;background:var(--bg);color:var(--blue-700);font-weight:700;font-size:13px;height:38px;padding:0 14px;border-radius:9px;transition:.14s;border:1px solid var(--line)}
.btn-buy:hover{background:var(--blue-600);color:#fff;border-color:transparent}
.btn-buy.added{background:var(--success-bg);color:var(--success);border-color:transparent}

/* ===== generic section ===== */
.section{padding:52px 0}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:26px}
.sec-head h2{font-size:28px;font-weight:800;letter-spacing:-.025em;margin:0}
.sec-head .sub{color:var(--slate-500);font-size:14.5px;margin-top:6px}
.sec-link{display:inline-flex;align-items:center;gap:6px;color:var(--blue-600);font-weight:700;font-size:14px;transition:.14s}
.sec-link:hover{gap:10px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}

/* ===== hero (Stripe-editorial: light base + localized light ribbon) ===== */
.hero{position:relative;background:linear-gradient(180deg,#ffffff 0%,#f7fafe 55%,#eef5fc 100%);color:var(--ink);overflow:hidden;border-bottom:1px solid var(--line-soft)}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(23,87,200,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(23,87,200,.035) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(120% 90% at 70% 0%,#000 30%,transparent 72%)}
.hero-wave-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:0;opacity:.85}
/* white grounding so the ribbon stays a localized accent, never colors the whole base */
.hero-base-fade{position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(85% 70% at 22% 48%,rgba(255,255,255,.78) 0%,rgba(255,255,255,.30) 38%,transparent 60%),linear-gradient(180deg,transparent 60%,rgba(255,255,255,.55) 100%)}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:1.06fr .94fr;gap:56px;align-items:center;padding:76px 24px 84px}
.hero-kicker{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.7);backdrop-filter:blur(6px);border:1px solid var(--line);color:var(--blue-700);font-size:12.5px;font-weight:700;padding:6px 14px;border-radius:999px;margin-bottom:22px;letter-spacing:.01em}
.hero-kicker .hk-dot{width:7px;height:7px;border-radius:50%;background:var(--cyan-500);box-shadow:0 0 0 4px rgba(21,174,216,.18);animation:hk-pulse 2.4s ease-in-out infinite}
@keyframes hk-pulse{0%,100%{box-shadow:0 0 0 3px rgba(21,174,216,.18)}50%{box-shadow:0 0 0 6px rgba(21,174,216,.06)}}
.hero h1{font-size:56px;line-height:1.04;font-weight:800;letter-spacing:-.034em;margin:0 0 18px}
.hero h1 .grad{background:linear-gradient(100deg,var(--blue-600) 10%,var(--cyan-500) 70%,#8c93f0 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-sub{font-size:17px;line-height:1.66;color:var(--slate-600);max-width:520px;margin-bottom:32px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.hero-cta-note{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--slate-500);margin-bottom:34px}
.hero-cta-note svg{color:var(--cyan-600);flex-shrink:0}
.hero-stats{display:grid;grid-template-columns:repeat(4,auto);gap:34px}
.hstat .hs-n{font-size:30px;font-weight:800;letter-spacing:-.025em}
.hstat .hs-n .u{color:var(--cyan-500)}
.hstat .hs-l{font-size:12.5px;color:var(--slate-400);margin-top:3px;font-weight:600}

/* ===== hero floating signal cards (V2) ===== */
.hero-r{position:relative}
.hero-signals{position:relative;height:100%;min-height:460px}
.hsig{position:absolute;display:flex;align-items:center;gap:14px;text-align:left;
  background:rgba(255,255,255,.82);backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.9);border-radius:18px;
  box-shadow:0 14px 40px rgba(9,24,48,.12);padding:15px 18px;cursor:pointer;
  font-family:var(--font);transition:transform .22s cubic-bezier(.16,1,.3,1),box-shadow .22s}
.hsig:hover{transform:translateY(-4px) scale(1.015);box-shadow:0 20px 50px rgba(9,24,48,.18)}
.hsig:active{transform:translateY(-1px) scale(.99)}
.hsig-ic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hsig-tx{display:flex;flex-direction:column;min-width:0}
.hsig-t{font-size:14px;font-weight:800;letter-spacing:-.01em;color:var(--ink);line-height:1.25}
.hsig-d{font-size:12px;color:var(--slate-500);font-weight:600;margin-top:3px;line-height:1.3}
.hsig.s1{top:14px;left:14px;right:34px}
.hsig.s2{top:132px;right:0;left:64px}
.hsig.s3{top:250px;left:8px;right:44px}
.hsig.s4{top:368px;right:14px;left:84px}
@keyframes hsigIn{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@media (prefers-reduced-motion: no-preference){
  .hsig{animation:hsigIn .6s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--d,.2s)}
}

/* ===== hero branded device collage (bento) ===== */
.hero-collage{position:relative;border-radius:22px;padding:18px;background:linear-gradient(150deg,rgba(255,255,255,.86),rgba(238,245,252,.7));border:1px solid rgba(200,223,244,.7);box-shadow:0 24px 60px rgba(15,52,120,.13),0 4px 16px rgba(15,52,120,.07);backdrop-filter:blur(8px)}
.hc-bento{display:grid;grid-template-columns:1.32fr 1fr;grid-template-rows:repeat(3,1fr);gap:12px;aspect-ratio:1/.92;
  grid-template-areas:"uzi mon" "uzi vent" "defib ster"}
.hc-tile{background:#fff;border:1px solid var(--line-soft);border-radius:15px;padding:14px 15px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;cursor:pointer;transition:.16s;box-shadow:0 1px 3px rgba(11,31,58,.04);min-width:0}
.hc-tile:hover{border-color:rgba(23,87,200,.28);box-shadow:0 10px 26px rgba(15,52,120,.12);transform:translateY(-2px)}
.hc-uzi{grid-area:uzi}.hc-mon{grid-area:mon}.hc-vent{grid-area:vent}.hc-defib{grid-area:defib}.hc-ster{grid-area:ster}
.hc-big{background:linear-gradient(155deg,#fff 0%,#f4f9ff 100%)}
.hc-ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hc-big .hc-ic{width:54px;height:54px;border-radius:15px}
.hc-meta{min-width:0}
.hc-name{font-size:13.5px;font-weight:800;letter-spacing:-.01em;line-height:1.2;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc-big .hc-name{font-size:19px;line-height:1.15;white-space:normal}
.hc-tag{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;margin-top:5px}
.hc-big .hc-tag{font-size:12.5px}
.hc-tag .hc-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.hero-collage .hero-float{position:absolute}
.hero-collage .hero-float.f1{top:-14px;left:-20px}
.hero-collage .hero-float.f2{bottom:-14px;right:-18px}
[data-theme="dark"] .hero-collage{background:linear-gradient(150deg,rgba(18,32,48,.7),rgba(10,22,40,.6));border-color:var(--line)}
[data-theme="dark"] .hc-tile{background:var(--surface);border-color:var(--line)}
[data-theme="dark"] .hc-big{background:linear-gradient(155deg,var(--surface),var(--navy-700))}
[data-theme="dark"] .hc-name{color:var(--ink)}
.hero-card{position:relative;background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--sh-lg)}
.hero-card .hc-ph{aspect-ratio:4/3;border-radius:14px;background:linear-gradient(150deg,#eaf1fa,#dbe8f6);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--blue-600)}
.hero-card .hc-ph .ph-grid{opacity:.5}
.hero-card .hc-row{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-top:16px}
.hero-card .hc-row>div:first-child{min-width:0;flex:1}
.hero-card .hc-name{font-weight:700;font-size:15px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-card .hc-sku{font-size:12px;color:var(--slate-400);font-family:var(--mono);margin-top:3px}
.hero-card .hc-price{font-weight:800;font-size:19px;white-space:nowrap;flex-shrink:0}
.hero-float{position:absolute;background:#fff;color:var(--ink);border-radius:13px;box-shadow:var(--sh-lg);padding:13px 16px;display:flex;align-items:center;gap:11px;font-weight:700;font-size:13.5px}
.hero-float .hf-ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.hero-float.f1{top:8px;left:-26px}
.hero-float.f2{bottom:96px;right:-22px}
.hero-float .hf-s{font-size:11.5px;color:var(--slate-500);font-weight:600}
.hero-float>div>div:first-child{white-space:nowrap}

/* ===== hero video slot ===== */
.hero-video-slot{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:16/10;background:linear-gradient(150deg,#f4f9ff 0%,#e8f2fc 50%,#eaf6fe 100%);border:1px solid rgba(200,223,244,.8);box-shadow:0 24px 60px rgba(15,52,120,.16),0 4px 14px rgba(15,52,120,.08);flex-shrink:0;backdrop-filter:blur(2px)}
.hero-video-slot.drag{border:2px dashed var(--blue-500);background:rgba(23,87,200,.05)}
.hero-video-slot .hvs-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(23,87,200,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(23,87,200,.04) 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
.hero-vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.hvs-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.18s}
.hvs-overlay:hover .hvs-play-btn{transform:scale(1.07);box-shadow:var(--sh-lg)}
.hvs-play-btn{width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);box-shadow:0 8px 28px rgba(14,42,82,.18);display:flex;align-items:center;justify-content:center;color:var(--blue-700);transition:.16s}
.hvs-change{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.9);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--blue-700);border:1px solid var(--line);box-shadow:var(--sh-sm);transition:.14s;z-index:4}
.hvs-change:hover{background:var(--blue-600);color:#fff;border-color:transparent}
.hvs-change input{display:none}
.hvs-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:32px;text-align:center;z-index:2}
.hvs-empty-ic{color:var(--blue-500);opacity:.22;margin-bottom:2px}
.hvs-empty-badge{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:700;color:var(--blue-700);box-shadow:var(--sh-sm);margin-bottom:4px}
.hvs-empty-title{font-size:18px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
.hvs-empty-sub{font-size:13px;color:var(--slate-400);font-family:var(--mono);margin-top:-2px}
.hvs-empty .hvs-btn{display:inline-flex;align-items:center;gap:8px;background:var(--grad-brand);color:#fff;font-weight:700;font-size:14px;height:44px;padding:0 22px;border-radius:10px;cursor:pointer;border:none;margin-top:8px;box-shadow:0 4px 14px rgba(26,95,208,.22)}
.hvs-empty .hvs-btn:hover{filter:brightness(1.06)}
.hvs-empty .hvs-btn input{display:none}
/* floats inside video slot */
.hero-video-slot .hero-float{position:absolute;background:#fff;color:var(--ink);border-radius:13px;box-shadow:var(--sh-lg);padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:13px;z-index:3}
.hero-video-slot .hero-float.f1{top:16px;left:16px}
.hero-video-slot .hero-float.f2{bottom:16px;right:16px}
.hvs-progress{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.2)}
.hvs-progress-bar{height:100%;background:var(--grad-brand);transition:width .3s linear}

/* ===== category tiles ===== */
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.cat-tile{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;display:flex;flex-direction:column;gap:16px;overflow:hidden;transition:.16s;cursor:pointer}
.cat-tile:hover{box-shadow:var(--sh-lg);transform:translateY(-3px);border-color:transparent}
.cat-tile .ct-ic{width:54px;height:54px;border-radius:14px;background:var(--bg-2);color:var(--blue-600);display:flex;align-items:center;justify-content:center;transition:.16s}
.cat-tile:hover .ct-ic{background:var(--grad-brand);color:#fff}
.cat-tile h3{font-size:18px;font-weight:800;margin:0;letter-spacing:-.01em}
.cat-tile .ct-subs{display:flex;flex-direction:column;gap:4px}
.cat-tile .ct-subs a{font-size:13.5px;color:var(--slate-500);padding:2px 0}
.cat-tile .ct-subs a:hover{color:var(--blue-600)}
.cat-tile .ct-more{margin-top:auto;display:inline-flex;align-items:center;gap:7px;color:var(--blue-600);font-weight:700;font-size:13.5px}
.cat-tile .ct-watermark{position:absolute;right:-18px;bottom:-18px;color:hsl(210 50% 92%);pointer-events:none}
.cat-tile .ct-count{position:absolute;top:24px;right:24px;font-family:var(--mono);font-size:12px;color:var(--slate-400);background:var(--bg);padding:3px 9px;border-radius:7px}

/* ===== trust band ===== */
.trust{background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.trust-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.trust-it{padding:36px 28px;display:flex;flex-direction:column;gap:13px;border-right:1px solid var(--line)}
.trust-it:last-child{border-right:none}
.trust-it .ti-ic{width:46px;height:46px;border-radius:12px;background:var(--bg-2);color:var(--cyan-600);display:flex;align-items:center;justify-content:center}
.trust-it h4{margin:0;font-size:16px;font-weight:800}
.trust-it p{margin:0;font-size:13.5px;color:var(--slate-500);line-height:1.55}

/* ===== brands ===== */
/* unified brand-card grid (identical form to corp soi.uz) */
.brand-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.brand-card{display:flex;align-items:center;gap:15px;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:16px 18px;transition:.16s;cursor:pointer;text-align:left;width:100%}
.brand-card:hover{border-color:var(--blue-400);box-shadow:0 10px 28px rgba(9,24,48,.10);transform:translateY(-2px)}
.brand-card .bc-logo{width:54px;height:54px;flex-shrink:0;border-radius:12px;background:linear-gradient(135deg,var(--blue-50,#eaf2ff),#dbeafb);color:var(--blue-600);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;letter-spacing:.02em}
.brand-card .bc-info{flex:1;min-width:0;display:flex;flex-direction:column}
.brand-card .bc-name{font-size:16px;font-weight:800;letter-spacing:-.01em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-card .bc-cat{font-size:12.5px;color:var(--slate-500);font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[data-theme="dark"] .brand-card{background:var(--surface);border-color:var(--line)}
[data-theme="dark"] .brand-card .bc-logo{background:#16273f;color:var(--blue-400)}
@media(max-width:980px){.brand-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:680px){.brand-grid{grid-template-columns:1fr 1fr}}
@media(max-width:440px){.brand-grid{grid-template-columns:1fr}}
.brand-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.brand-chip{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:7px;transition:.14s;cursor:pointer}
.brand-chip:hover{box-shadow:var(--sh);border-color:var(--blue-500);transform:translateY(-2px)}
.brand-chip .bc-name{font-weight:800;font-size:18px;letter-spacing:-.01em}
.brand-chip .bc-country{font-size:12px;color:var(--slate-400)}

/* compact brand pills (unified Главная + Каталог) */
.brand-pills{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:1000px;margin:0 auto;max-height:100px;overflow:hidden}
.brand-pill{display:inline-flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 15px 7px 7px;transition:transform .15s,box-shadow .15s,border-color .15s;cursor:pointer}
.brand-pill:hover{border-color:var(--blue-400);box-shadow:0 6px 18px rgba(9,24,48,.09);transform:translateY(-2px)}
.brand-pill .bp-mono{width:30px;height:30px;flex-shrink:0;border-radius:50%;background:linear-gradient(135deg,var(--blue-50,#eaf2ff),#dbeafb);color:var(--blue-600);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11.5px;letter-spacing:.02em}
.brand-pill .bp-name{font-size:14px;font-weight:700;letter-spacing:-.01em;color:var(--ink);white-space:nowrap}
.brand-pill .bp-flag{font-size:15px;line-height:1}
.brand-all-row{display:flex;justify-content:center;margin-top:26px}
.brand-all-link{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--blue-600);cursor:pointer;transition:gap .15s,opacity .15s}
.brand-all-link:hover{gap:12px;opacity:.85}
.brand-h-inline{display:inline-flex;align-items:center;gap:12px}
.brand-arrow{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--blue-50,#eaf2ff);color:var(--blue-600);font-size:18px;font-weight:700;cursor:pointer;transition:transform .15s,background .15s}
.brand-arrow:hover{transform:translateX(3px);background:#dbeafb}
[data-theme="dark"] .brand-arrow{background:#16273f;color:var(--blue-400)}
[data-theme="dark"] .brand-pill{background:var(--surface);border-color:var(--line)}
[data-theme="dark"] .brand-pill .bp-mono{background:#16273f;color:var(--blue-400)}
@media(max-width:560px){.brand-pill .bp-name{font-size:13px}.brand-pill{padding:6px 13px 6px 6px}}

/* ===== CTA band ===== */
.ctaband{position:relative;background:linear-gradient(115deg,#eaf3fc,#dbeafb);border:1px solid var(--line);border-radius:24px;color:var(--ink);padding:46px 52px;display:flex;align-items:center;gap:40px;overflow:hidden}
.ctaband .cb-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(26,95,208,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(26,95,208,.06) 1px,transparent 1px);background-size:40px 40px;mask-image:radial-gradient(80% 100% at 100% 0,#000,transparent 70%)}
.ctaband .cb-l{position:relative;flex:1}
.ctaband h2{font-size:30px;font-weight:800;margin:0 0 12px;letter-spacing:-.02em}
.ctaband p{margin:0;color:var(--slate-600);font-size:16px;line-height:1.55;max-width:560px}
.ctaband .cb-r{position:relative;display:flex;flex-direction:column;gap:12px;align-items:flex-end}
.ctaband .cb-phone{font-size:24px;font-weight:800}

/* ===== service band (per TZ 10.8) ===== */
.service-band{display:grid;grid-template-columns:1.5fr 1fr;gap:32px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:36px 40px}
.service-items{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.service-it{display:flex;align-items:center;gap:12px;font-size:14.5px;font-weight:700;color:var(--ink)}
.service-ic{width:42px;height:42px;flex-shrink:0;border-radius:11px;background:var(--blue-50,#eaf2ff);color:var(--blue-600);display:flex;align-items:center;justify-content:center}
.sb-card{background:linear-gradient(135deg,var(--blue-50,#eaf2ff),#e7f5fb);border:1px solid var(--line);border-radius:16px;padding:26px}
.sb-card h3{font-size:18px;font-weight:800;letter-spacing:-.01em;margin-bottom:8px}
.sb-card p{font-size:13.5px;color:var(--slate-600);line-height:1.5;margin-bottom:18px}
[data-theme="dark"] .service-band{background:var(--surface);border-color:var(--line)}
[data-theme="dark"] .service-ic{background:#16273f}
[data-theme="dark"] .sb-card{background:#11233a;border-color:var(--line)}
@media(max-width:860px){.service-band{grid-template-columns:1fr;padding:28px 24px}}
@media(max-width:480px){.service-items{grid-template-columns:1fr}}

/* ===== hero badges (per TZ 10.1) ===== */
.hero-badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.hero-badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--slate-600);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 13px}
.hero-badge svg{color:var(--success,#1b9e58)}
[data-theme="dark"] .hero-badge{background:var(--surface);border-color:var(--line);color:var(--slate-400)}

/* ===== equip scenarios ===== */
.equip-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.equip-card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px;cursor:pointer;text-align:left;transition:.16s;font-family:inherit;color:var(--ink)}
.equip-card:hover{border-color:var(--blue-400,#5b9bf0);box-shadow:0 8px 24px rgba(9,24,48,.08);transform:translateY(-2px)}
.equip-ic{width:46px;height:46px;border-radius:12px;background:var(--blue-50,#eaf2ff);color:var(--blue-600,#1a5fd0);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.equip-t{flex:1;font-size:14.5px;font-weight:700;line-height:1.25}
.equip-arr{color:var(--slate-300,#b8c4d2);flex-shrink:0;transition:transform .15s,color .15s}
.equip-card:hover .equip-arr{color:var(--blue-600,#1a5fd0);transform:translateX(3px)}

/* ===== tender band ===== */
.tender-band{position:relative;overflow:hidden;background:linear-gradient(118deg,#0e1f3a,#16407e);border-radius:24px;padding:42px 48px;display:flex;align-items:center;gap:40px;flex-wrap:wrap}
.tender-band::after{content:"";position:absolute;right:-70px;top:-70px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(54,150,220,.45),transparent 70%);filter:blur(30px)}
.tb-tx{position:relative;z-index:2;flex:1;min-width:300px}
.tb-badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.08em;background:rgba(255,255,255,.16);color:#cfe2ff;padding:5px 11px;border-radius:6px;margin-bottom:14px}
.tender-band h3{font-size:27px;font-weight:800;color:#fff;letter-spacing:-.02em;margin:0 0 12px;line-height:1.18}
.tender-band p{font-size:15.5px;color:rgba(255,255,255,.8);line-height:1.6;margin:0;max-width:560px}
.tb-actions{position:relative;z-index:2;display:flex;flex-direction:column;gap:12px;align-items:stretch;min-width:230px}
.btn-ghost-d{background:rgba(255,255,255,.08);color:#fff;border:1.5px solid rgba(255,255,255,.25);font-weight:700;border-radius:11px;padding:13px 22px;cursor:pointer;font-size:14.5px;font-family:inherit;transition:.15s}
.btn-ghost-d:hover{background:rgba(255,255,255,.16)}
.tb-dl{display:inline-flex;align-items:center;gap:8px;color:#cfe2ff;font-size:13.5px;font-weight:700;justify-content:center;padding-top:2px}
.tb-dl:hover{color:#fff}
[data-theme="dark"] .equip-card{background:var(--surface);border-color:var(--line)}
[data-theme="dark"] .equip-ic{background:#16273f}
@media(max-width:980px){.equip-grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.equip-grid{grid-template-columns:1fr}.tender-band{padding:32px 26px}.tender-band h3{font-size:22px}}

/* ===== footer ===== */
.foot{background:#0e1f3a;color:#9fb4cf;margin-top:64px}
.qm-file{width:100%;font-size:13px;padding:9px 12px;border:1px dashed var(--line);border-radius:9px;background:var(--bg,#f5f8fc);cursor:pointer;color:var(--slate-600)}
.qm-file-hint{font-size:11.5px;color:var(--slate-400);margin-top:5px}
.qm-consent{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;color:var(--slate-500);line-height:1.5;margin:4px 0 14px;cursor:pointer}
.qm-consent input{margin-top:2px;flex-shrink:0}
.foot.light{background:#eef3f9;color:var(--slate-600);border-top:1px solid var(--line)}

/* ===== SKELETON LOADERS ===== */

/* grid + card */

.sk-card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}

.sk-filters{display:flex;flex-direction:column;gap:24px}
.sk-filter-grp{display:flex;flex-direction:column;gap:10px}
.sk-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
/* product */
.sk-product{display:grid;grid-template-columns:1fr 1fr;gap:36px}
.sk-pgallery{display:flex;flex-direction:column;gap:12px}
.sk-pmain{width:100%;aspect-ratio:1/1;border-radius:16px}
.sk-pthumbs{display:flex;gap:10px}
.sk-pthumb{width:84px;height:84px;border-radius:11px}
.sk-pinfo{display:flex;flex-direction:column;gap:10px}
.sk-prow{display:flex;gap:10px}
/* hero */
.sk-hero{background:var(--grad-hero,linear-gradient(160deg,#f0f5fc,#e6eef8));padding:56px 0}

@keyframes page-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ===== RECOMMENDATION LETTERS (reviews) ===== */
.reco-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:26px;flex-wrap:wrap}

/* ===== BRANDS & MANUFACTURERS (pills) ===== */

.brand-pill:hover{border-color:var(--blue-400,#5b9bf0);box-shadow:0 10px 28px rgba(23,87,200,.14);transform:translateY(-3px)}

}
