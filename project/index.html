.nc-ic{width:52px;height:52px;border-radius:var(--r);background:var(--bg-2);color:var(--blue-600);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nc-body{flex:1;min-width:0}
.nc-meta{display:flex;gap:12px;font-size:var(--fs-2);font-weight:700;margin-bottom:8px}
.nc-cat{color:var(--blue-600)}
.nc-date{color:var(--slate-400);font-family:var(--mono)}
.nc-title{font-size:var(--fs-5);font-weight:800;margin-bottom:6px;line-height:1.35}
.nc-text{font-size:var(--fs-3);color:var(--slate-600);line-height:1.55}
.news-home-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.nhg-card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;cursor:pointer;transition:.14s;box-shadow:var(--sh-sm)}
.nhg-card:hover{box-shadow:var(--sh);transform:translateY(-2px);border-color:var(--blue-400)}
.nhg-ic{width:40px;height:40px;border-radius:var(--r);background:var(--bg-2);color:var(--blue-600);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.nhg-cat{font-size:var(--fs-2);font-weight:700;color:var(--blue-600);margin-bottom:6px}
.nhg-title{font-size:var(--fs-4);font-weight:800;margin-bottom:8px;line-height:1.35}
.nhg-text{font-size:var(--fs-3);color:var(--slate-500);line-height:1.5}

/* ===== kits ===== */
.kit-card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:0;overflow:hidden;cursor:pointer;transition:.14s;box-shadow:var(--sh-sm)}
.kit-card:hover{box-shadow:var(--sh-lg);transform:translateY(-3px)}
.kc-head{display:flex;gap:16px;align-items:flex-start;padding:22px 22px 18px}
.kc-ic{width:52px;height:52px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kc-title{font-size:var(--fs-6);font-weight:800;margin-bottom:6px}
.kc-desc{font-size:var(--fs-3);color:var(--slate-600);line-height:1.5}
.kc-meta{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;background:var(--bg)}
.kc-sum{display:flex;align-items:baseline;gap:5px}
.kcs-from{font-size:var(--fs-2);color:var(--slate-400);font-weight:600}
.kcs-val{font-size:var(--fs-7);font-weight:800;font-family:var(--mono);color:var(--blue-700)}
.kcs-cur{font-size:var(--fs-3);color:var(--slate-500)}
.kc-time{font-size:var(--fs-3);color:var(--slate-500);display:flex;align-items:center;gap:6px;font-weight:600}
.kc-items{padding:18px 22px}

/* ===== tracking ===== */
.track-card{background:#fff;border:1px solid var(--line);border-radius:var(--r-xl);padding:28px;box-shadow:var(--sh-lg)}
.trk-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.trk-num{font-size:var(--fs-6);font-weight:800;letter-spacing:-.01em}
.trk-steps{display:flex;align-items:flex-start;position:relative;margin:0 0 8px}
.trk-step{display:flex;flex-direction:column;align-items:center;flex:1;position:relative}
.trk-dot{width:36px;height:36px;border-radius:50%;background:var(--bg-2);color:var(--slate-400);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;z-index:2;position:relative;transition:.2s}
.trk-dot.done{background:var(--blue-600);color:#fff;border-color:var(--blue-600)}
.trk-dot.active{background:var(--blue-600);color:#fff;border-color:var(--blue-600);box-shadow:var(--sh)}
.trk-line{position:absolute;top:17px;left:calc(50% + 18px);right:calc(-50% + 18px);height:2px;background:var(--line);z-index:1;transition:.2s}
.trk-line.done{background:var(--blue-600)}
.trk-s-label{font-size:var(--fs-2);font-weight:700;color:var(--slate-600);margin-top:8px;text-align:center}
.trk-s-date{font-size:var(--fs-1);color:var(--slate-400);font-family:var(--mono);margin-top:2px;text-align:center}

@media(max-width:860px){.news-layout{grid-template-columns:1fr}.news-home-grid{grid-template-columns:1fr}.rev-grid{grid-template-columns:1fr}.trk-s-label{font-size:var(--fs-1)}}

/* ===== mobile nav ===== */
.mob-hamburger{display:none;width:44px;height:44px;border-radius:var(--r-sm);align-items:center;justify-content:center;background:var(--bg-2);color:var(--ink);border:1.5px solid var(--line);flex-shrink:0}
.mob-ov{position:fixed;inset:0;background:rgba(10,28,56,.45);z-index:70;animation:fade .15s}
.mob-drawer{position:fixed;top:0;left:0;bottom:0;width:320px;max-width:88vw;background:#fff;z-index:71;overflow-y:auto;box-shadow:var(--sh-lg);animation:slide-in-left .2s cubic-bezier(.2,.8,.2,1)}
@keyframes slide-in-left{from{transform:translateX(-100%)}to{transform:none}}
.mob-drawer-head{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 14px}
.mob-close{width:36px;height:36px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;background:var(--bg-2);color:var(--slate-600)}
.mob-search{display:flex;align-items:center;gap:10px;margin:14px;background:var(--bg);border-radius:var(--r-sm);padding:0 14px;height:44px}
.mob-search input{flex:1;border:none;background:none;outline:none;font-size:var(--fs-4);font-family:var(--font)}
.mob-section-title{font-size:var(--fs-1);font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--slate-400);padding:12px 18px 6px}
.mob-cat-item{display:flex;align-items:center;gap:12px;padding:13px 18px;cursor:pointer;font-size:var(--fs-4);font-weight:600;transition:.12s}
.mob-cat-item:hover{background:var(--bg-2);color:var(--blue-600)}
.mob-cat-ic{width:34px;height:34px;border-radius:var(--r-sm);background:var(--bg-2);color:var(--blue-600);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mob-nav-item{padding:13px 18px;font-size:var(--fs-4);font-weight:600;color:var(--slate-700);cursor:pointer}
.mob-nav-item:hover{background:var(--bg-2);color:var(--blue-600)}
/* mobile catalog accordion */
.mob-acc{}
.mob-acc-head{display:flex;align-items:center;gap:12px;width:100%;padding:13px 18px;background:none;border:none;font-size:var(--fs-4);font-weight:600;color:var(--slate-700);cursor:pointer;text-align:left}
.mob-acc-head:hover{background:var(--bg-2);color:var(--blue-600)}
.mob-acc-head>span:nth-child(2){flex:1;min-width:0}
.mob-acc-chev{margin-left:auto;color:var(--slate-400);transition:transform .2s}
.mob-acc.open .mob-acc-chev{transform:rotate(180deg);color:var(--blue-600)}
.mob-acc-body{background:var(--bg);padding:4px 0 8px}
.mob-acc-sub{display:block;padding:10px 18px 10px 48px;font-size:var(--fs-3);font-weight:600;color:var(--slate-600);cursor:pointer}
.mob-acc-sub:hover{background:var(--bg-2);color:var(--blue-600)}
.mob-acc-sub.mob-acc-all{color:var(--blue-700);font-weight:700}
[data-theme="dark"] .mob-acc-head:hover,[data-theme="dark"] .mob-acc-sub:hover{background:var(--bg-2)}
.mob-phone{display:flex;align-items:center;gap:10px;margin:18px;font-weight:800;font-size:var(--fs-5);color:var(--blue-700)}
.mob-bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);height:62px;padding-bottom:env(safe-area-inset-bottom);box-shadow:var(--sh-lg)}
.mbn-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:100%;min-width:44px;color:var(--slate-500);font-size:var(--fs-1);font-weight:700;position:relative;padding:0 4px}
.mbn-item:hover,.mbn-item:active{color:var(--blue-600)}
.mbn-item.fab{width:52px;height:52px;border-radius:50%;background:var(--grad-brand);color:var(--cta-ink);margin-top:-12px;box-shadow:var(--sh)}
.mbn-cnt{position:absolute;top:4px;right:4px;min-width:16px;height:16px;background:var(--blue-600);color:#fff;border-radius:99px;font-size:var(--fs-1);font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 3px;border:2px solid #fff}
/* ===== online + view counter ===== */
.online-widget{display:inline-flex;align-items:center;gap:7px;background:var(--line-2);border:1px solid var(--line);border-radius:var(--r-pill);padding:5px 13px;font-size:var(--fs-3);font-weight:700;color:var(--accent);margin-bottom:14px}
.ow-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:ow-pulse 2s ease-in-out infinite;flex-shrink:0}
@keyframes ow-pulse{0%,100%{box-shadow:0 0 0 0 rgba(14,74,198,.4)}50%{box-shadow:0 0 0 6px rgba(14,74,198,0)}}
.view-counter{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-3);color:var(--slate-500);font-weight:600;margin-top:6px}
/* ===== hero inline form ===== */
.hero-form{background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh-lg);margin-top:24px;max-width:480px}
.hero-form h4{font-size:var(--fs-4);font-weight:800;margin-bottom:12px}
.hero-form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.hf-input{height:42px;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:0 13px;font-size:var(--fs-4);font-family:var(--font);outline:none;width:100%;box-sizing:border-box}
.hf-input:focus{border-color:var(--blue-500)}
.hf-ok{display:flex;align-items:center;gap:9px;background:var(--line-2);color:var(--success);border-radius:var(--r-sm);padding:12px 16px;font-weight:700;font-size:var(--fs-4)}
/* ===== calculator ===== */
.calc-layout{display:grid;grid-template-columns:1fr 300px;gap:36px;padding-top:8px;align-items:start}
.calc-section{margin-bottom:24px}
.calc-label{font-size:var(--fs-4);font-weight:700;color:var(--slate-600);display:block;margin-bottom:10px}
.calc-type-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.calc-type-btn,.calc-level-btn{padding:10px 14px;border:1.5px solid var(--line);border-radius:var(--r-sm);font-weight:700;font-size:var(--fs-3);background:#fff;cursor:pointer;transition:.13s;text-align:left;font-family:var(--font);color:var(--slate-700)}
.calc-type-btn.on,.calc-level-btn.on{border-color:var(--blue-600);background:var(--blue-600);color:#fff}
.calc-type-btn:hover:not(.on),.calc-level-btn:hover:not(.on){border-color:var(--blue-400);color:var(--blue-600)}
.calc-slider{-webkit-appearance:none;width:100%;height:6px;border-radius:99px;background:var(--line);outline:none;cursor:pointer}
.calc-slider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--blue-600);border:3px solid #fff;box-shadow:var(--sh);cursor:pointer}
.calc-result{background:linear-gradient(135deg,var(--blue-50),var(--line-soft));border:1px solid #c8deff;border-radius:var(--r-lg);padding:24px;margin-top:8px;text-align:center}
.cr-label{font-size:var(--fs-3);font-weight:700;color:var(--slate-500);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.cr-val{font-size:var(--fs-9);font-weight:800;letter-spacing:-.03em;color:var(--blue-700);line-height:1}
.cr-cur{font-size:var(--fs-6);font-weight:600;color:var(--slate-500)}
.cr-range{font-size:var(--fs-3);color:var(--slate-500);margin-top:8px}
@media(max-width:860px){.calc-layout{grid-template-columns:1fr}.mob-hamburger{display:flex}.mob-bottom-nav{display:grid;grid-template-columns:repeat(5,1fr)}.head .search{max-width:200px}.app-main{padding-bottom:72px}.hero-form-row{grid-template-columns:1fr}.hero-form{max-width:100%}.nav{display:none}.ubar .ubar-links,.ubar .ubar-info.delivery{display:none}
  /* bottom nav already has a call button — hide the floating FAB to avoid a duplicate that overlaps the cart icon */
  .fab-wrap{display:none}}

/* ===== multi-cat: also-in tags ===== */
.pdp-also-in{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:6px 0 10px;font-size:var(--fs-3);color:var(--slate-500)}
.pdp-also-in>span{font-weight:700;white-space:nowrap;flex-shrink:0}
.pdp-cat-tag{display:inline-flex;align-items:center;gap:4px;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-pill);padding:3px 12px;font-size:var(--fs-2);font-weight:700;color:var(--blue-700);cursor:pointer;transition:.13s;white-space:nowrap}
.pdp-cat-tag:hover{background:var(--blue-600);color:#fff;border-color:var(--blue-600)}

/* ===== variants selector ===== */
.pdp-variants{margin:14px 0 0;padding:14px 16px;background:var(--bg);border-radius:var(--r);border:1px solid var(--line)}
.pv-label{font-size:var(--fs-1);font-weight:800;color:var(--slate-400);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
.pv-opts{display:flex;flex-wrap:wrap;gap:7px}
.pv-opt{padding:8px 16px;border:1.5px solid var(--line);border-radius:var(--r-sm);font-size:var(--fs-3);font-weight:700;background:#fff;color:var(--slate-700);cursor:pointer;transition:.13s;font-family:var(--font)}
.pv-opt:hover:not(.on){border-color:var(--blue-400);color:var(--blue-600);background:var(--bg-2)}
.pv-opt.on{border-color:var(--blue-600);background:var(--blue-600);color:#fff;box-shadow:var(--sh)}

/* ===== direction group tiles (home + catalog sidebar) ===== */
.dir-groups-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:4px}
.dir-group-tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--sh-sm);transition:.15s}
.dir-group-tile:hover{box-shadow:var(--sh);transform:translateY(-2px)}
.dgt-head{display:flex;align-items:center;gap:14px;padding:20px 22px 16px;cursor:pointer;border-left:4px solid var(--line);transition:.13s}
.dgt-head:hover{background:var(--bg)}
.dgt-ic{width:44px;height:44px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dgt-title-wrap{flex:1;min-width:0}
.dgt-title{font-size:var(--fs-5);font-weight:800;margin:0 0 3px;line-height:1.25;letter-spacing:-.01em}
.dgt-count{font-size:var(--fs-2);font-weight:600;color:var(--slate-400);font-family:var(--mono)}
.dgt-dirs{display:grid;grid-template-columns:1fr 1fr}
.dgt-dir{padding:9px 20px;font-size:var(--fs-3);font-weight:600;color:var(--slate-700);cursor:pointer;transition:.12s;display:flex;align-items:center;gap:6px;line-height:1.35;text-wrap:pretty}
.dgt-dir::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--line);flex-shrink:0;transition:.12s}
.dgt-dir:hover{background:var(--bg-2);color:var(--blue-700)}
.dgt-dir:hover::before{background:var(--blue-500)}
@media(max-width:860px){.dir-groups-grid{grid-template-columns:1fr}.dgt-dirs{grid-template-columns:1fr}}

/* ===== QUICK VIEW ===== */
.qv-ov{position:fixed;inset:0;background:rgba(9,24,48,.6);backdrop-filter:blur(5px);z-index:950;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .15s ease}
.qv-box{background:var(--surface);border-radius:var(--r-lg);width:100%;max-width:860px;max-height:90vh;overflow-y:auto;position:relative;box-shadow:var(--sh-xl);animation:slideUp .18s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.qv-close{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;background:var(--bg-2);border:1px solid var(--line);color:var(--slate-500);display:flex;align-items:center;justify-content:center;z-index:2;transition:.13s}
.qv-close:hover{background:var(--slate-200);color:var(--ink)}
[data-theme="dark"] .qv-close:hover{background:var(--bg)}
.qv-layout{display:grid;grid-template-columns:1fr 1fr;min-height:420px}
.qv-img-col{padding:28px 24px 20px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.qv-dirs{display:flex;flex-wrap:wrap;gap:6px}
.qv-dir-tag{font-size:var(--fs-1);font-weight:700;color:var(--blue-700);background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-pill);padding:3px 10px}
.qv-info{padding:28px 28px 24px;display:flex;flex-direction:column;gap:13px}
.qv-tags{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.qv-title{font-size:var(--fs-6);font-weight:800;letter-spacing:-.02em;line-height:1.3;margin:0}
.qv-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qv-brand{display:flex;align-items:center;gap:5px;font-size:var(--fs-3);font-weight:700;color:var(--slate-700)}
.qv-country{color:var(--slate-400);font-weight:600}
.qv-sku{font-size:var(--fs-2);color:var(--slate-400)}
.qv-specs{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.qvs-row{display:grid;grid-template-columns:1fr 1fr;padding:8px 13px;font-size:var(--fs-2)}
.qvs-row:last-child{}
.qvs-row:nth-child(even){background:var(--bg-2)}
.qvs-k{color:var(--slate-500);font-weight:600}
.qvs-v{font-weight:700;color:var(--ink)}
.qv-variants{}
.qv-buy-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.qv-actions{display:flex;gap:8px;flex-wrap:wrap}
.qv-actions .flex-1{flex:1;min-width:0;justify-content:center}
.qv-fullpage{display:flex;align-items:center;gap:6px;color:var(--blue-600);font-size:var(--fs-3);font-weight:700;margin-top:2px;padding-top:4px;width:fit-content}
.qv-fullpage:hover{color:var(--blue-800);text-decoration:underline}
/* qv btn on card hover */
.card-media{position:relative;overflow:hidden}
.qv-btn{position:absolute;bottom:10px;left:50%;transform:translateX(-50%) translateY(8px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:6px;background:rgba(9,24,48,.8);backdrop-filter:blur(6px);color:#fff;border-radius:var(--r-pill);padding:7px 16px;font-size:var(--fs-2);font-weight:700;transition:.2s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;border:1px solid rgba(255,255,255,.12)}
.card:hover .qv-btn{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.qv-btn:hover{background:var(--blue-600)}
@media(max-width:680px){.qv-layout{grid-template-columns:1fr}.qv-img-col{border-right:none;padding:20px}.qv-box{max-height:95vh}.qv-btn{display:none}}

.mli-label{flex:1;min-width:0}
.mega-count{font-size:var(--fs-1);font-weight:700;background:var(--bg-2);color:var(--slate-500);border-radius:var(--r-pill);padding:2px 7px;margin-right:2px;flex-shrink:0}
.mega-li.on .mega-count{background:rgba(255,255,255,.22);color:#fff}

/* ===== FAQ ===== */
.faq-group{margin-bottom:32px}
.faq-cat{font-size:var(--fs-4);font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--blue-600);margin-bottom:14px}
.faq-item{border:1.5px solid var(--line);border-radius:var(--r);margin-bottom:10px;background:var(--surface);overflow:hidden;transition:.18s}
.faq-item.open{border-color:var(--blue-300);box-shadow:var(--sh-lg)}
.faq-q{width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px;font-size:var(--fs-5);font-weight:700;color:var(--ink);text-align:left;cursor:pointer}
.faq-chev{flex-shrink:0;color:var(--slate-400);transition:transform .25s}
.faq-item.open .faq-chev{transform:rotate(180deg);color:var(--blue-600)}
.faq-a-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s cubic-bezier(.16,1,.3,1)}
.faq-item.open .faq-a-wrap{grid-template-rows:1fr}
.faq-a{overflow:hidden;font-size:var(--fs-4);line-height:1.65;color:var(--slate-600)}
.faq-item.open .faq-a{padding:0 20px 20px}
.faq-cta{margin-top:40px;background:var(--bg-2);border-radius:var(--r-lg);padding:26px 30px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.faq-cta-t{font-size:var(--fs-6);font-weight:800;color:var(--ink);margin-bottom:4px}
.faq-cta-d{font-size:var(--fs-4);color:var(--slate-500)}

/* ===== CRM Integration ===== */
.crm-badge{display:inline-flex;align-items:center;gap:8px;border-radius:var(--r-sm);padding:9px 14px;font-size:var(--fs-3);font-weight:700;margin:8px auto 0;width:fit-content}
.crm-badge.ok{background:var(--line-2);color:var(--success)}
.crm-badge.err{background:var(--bg-2);color:var(--danger)}
.crm-cfg-block{margin-bottom:20px}
.crm-cfg-label{font-size:var(--fs-3);font-weight:700;color:var(--slate-600);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.crm-tag{background:var(--bg-2);color:var(--slate-500);border-radius:var(--r-sm);padding:2px 8px;font-size:var(--fs-1);font-weight:700}
.crm-note{font-size:var(--fs-3);line-height:1.55;color:var(--slate-500);margin-top:8px;padding:10px 14px;border-radius:var(--r-sm);background:var(--bg-2)}
.crm-note.warn{background:var(--bg-2);color:#92610a}
.crm-note.ok{background:var(--line-2);color:var(--success)}
.crm-toggle{display:flex;align-items:center;gap:14px;cursor:pointer;padding:16px 20px;background:var(--bg-2);border-radius:var(--r)}
.crm-toggle input{display:none}
.crm-toggle-track{width:44px;height:24px;border-radius:var(--r-pill);background:var(--line);transition:.2s;flex-shrink:0;position:relative}
.crm-toggle input:checked ~ .crm-toggle-track{background:var(--blue-600)}
.crm-toggle-knob{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:var(--sh-sm)}
.crm-toggle input:checked ~ .crm-toggle-track .crm-toggle-knob{left:23px}
/* spinner on submit */
.btn-spin{width:17px;height:17px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:inline-block;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== CONTACTS MAP ===== */
.contacts-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:32px;align-items:start;margin-top:8px}
.contacts-map{position:relative;height:420px;border-radius:var(--r-lg);overflow:hidden;border:1.5px solid var(--line);box-shadow:var(--sh)}
.map-card{position:absolute;left:16px;bottom:16px;right:16px;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-lg);padding:13px 15px;display:flex;align-items:center;gap:12px}
.map-card-ic{width:38px;height:38px;border-radius:var(--r-sm);background:var(--blue-600);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.map-card-t{font-weight:800;font-size:var(--fs-4);color:var(--ink)}
.map-card-d{font-size:var(--fs-2);color:var(--slate-500)}
.map-card-link{margin-left:auto;display:flex;align-items:center;gap:3px;color:var(--blue-600);font-weight:700;font-size:var(--fs-3);white-space:nowrap}
@media(max-width:760px){.contacts-grid{grid-template-columns:1fr}.contacts-map{height:320px}}

/* ===== CATALOG INFINITE SCROLL ===== */
.cat-loadmore{display:flex;flex-direction:column;align-items:center;gap:16px;padding:36px 0 8px}
.cat-progress{width:200px;height:4px;background:var(--bg-2);border-radius:var(--r-pill);overflow:hidden}
.cat-progress-bar{height:100%;background:var(--grad-brand);border-radius:var(--r-pill);transition:width .4s cubic-bezier(.16,1,.3,1)}
.cat-loadmore .btn{display:flex;align-items:center;gap:10px}
.lm-count{font-family:var(--mono);font-size:var(--fs-2);color:var(--slate-400);font-weight:600}

/* ===== COOKIE BANNER ===== */
.cookie-banner{position:fixed;left:0;right:0;bottom:0;z-index:120;padding:16px;animation:cookieUp .4s cubic-bezier(.16,1,.3,1)}
@keyframes cookieUp{from{transform:translateY(110%)}to{transform:translateY(0)}}
.cookie-inner{max-width:1080px;margin:0 auto;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-xl);padding:18px 22px;display:flex;align-items:center;gap:18px}
.cookie-ic{width:44px;height:44px;border-radius:var(--r);background:var(--bg-2);color:var(--blue-600);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cookie-text{flex:1;min-width:0}
.cookie-title{font-weight:800;font-size:var(--fs-4);margin-bottom:4px;color:var(--ink)}
.cookie-text p{font-size:var(--fs-2);line-height:1.55;color:var(--slate-500)}
.cookie-text a{color:var(--blue-600);font-weight:700;cursor:pointer;text-decoration:underline}
.cookie-actions{display:flex;gap:10px;flex-shrink:0}
.cookie-actions .btn{height:42px;padding:0 18px;font-size:var(--fs-3);white-space:nowrap}
@media(max-width:760px){
  .cookie-inner{flex-direction:column;align-items:flex-start;gap:14px;padding:16px}
  .cookie-actions{width:100%}
  .cookie-actions .btn{flex:1}
  .cookie-ic{display:none}
}

/* ===== QUOTE MODAL SERVICES ===== */
.qm-services{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.qm-svc{display:flex;align-items:center;gap:7px;padding:8px 14px;border:1.5px solid var(--line);border-radius:var(--r-sm);font-size:var(--fs-3);font-weight:700;cursor:pointer;color:var(--slate-600);background:var(--bg);transition:.13s;user-select:none}
.qm-svc:hover{border-color:var(--blue-400);color:var(--blue-600)}
.qm-svc.on{border-color:var(--blue-600);background:var(--blue-600);color:#fff}
.qm-svc-ic{width:16px;height:16px;border:1.5px solid currentColor;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:.5;transition:.13s}
.qm-svc.on .qm-svc-ic{opacity:1;border-color:rgba(255,255,255,.6)}

/* ===== HERO FALLBACK (no video) ===== */
.hvs-fallback{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:28px 24px;background:linear-gradient(145deg,var(--bg-2) 0%,var(--line-2) 100%)}
.hvs-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.hvs-stat-card{background:#fff;border-radius:var(--r);padding:14px 14px 12px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:3px;animation:hvsFadeUp .5s ease both}
@keyframes hvsFadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.hvs-stat-ic{width:36px;height:36px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.hvs-stat-n{font-size:var(--fs-7);font-weight:900;letter-spacing:-.02em;color:var(--navy-800)}
.hvs-stat-l{font-size:var(--fs-1);font-weight:600;color:var(--slate-500)}
.hvs-cats{display:flex;flex-wrap:wrap;gap:7px}
.hvs-cat-pill{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:var(--r-pill);padding:5px 12px;font-size:var(--fs-2);font-weight:700;color:var(--slate-700);animation:hvsFadeUp .5s ease both;box-shadow:var(--sh-sm)}
.hvs-upload-hint{display:flex;align-items:center;gap:7px;font-size:var(--fs-2);font-weight:600;color:var(--slate-400);cursor:pointer;margin-top:2px;width:fit-content}
.hvs-upload-hint:hover{color:var(--blue-600)}
[data-theme="dark"] .hvs-fallback{background:linear-gradient(145deg,var(--bg-2) 0%,var(--surface) 100%)}
[data-theme="dark"] .hvs-stat-card,[data-theme="dark"] .hvs-cat-pill{background:var(--surface);border-color:var(--line)}
[data-theme="dark"] .hvs-stat-n{color:var(--ink)}

/* ===== B2B PRICING ===== */
.vat-toggle{display:inline-flex;gap:0;border:1.5px solid var(--line);border-radius:var(--r-sm);overflow:hidden;margin-bottom:12px}
.vat-toggle button{padding:6px 16px;font-size:var(--fs-2);font-weight:700;color:var(--slate-500);background:var(--surface);transition:.13s;font-family:var(--font)}
.vat-toggle button.on{background:var(--blue-600);color:#fff}
.vat-toggle button:not(.on):hover{background:var(--bg-2);color:var(--blue-600)}
.vat-note{font-size:var(--fs-2);color:var(--slate-400);margin-top:4px;font-weight:600;min-height:16px}
/* bulk */
.bulk-block{margin:16px 0 4px;padding:14px 16px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r)}
.bulk-title{font-size:var(--fs-1);font-weight:800;color:var(--slate-400);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.bulk-tiers{display:flex;gap:9px;flex-wrap:wrap}
.bulk-tier{flex:1;min-width:130px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 13px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--surface);cursor:pointer;transition:.13s;position:relative;text-align:left}
.bulk-tier:hover{border-color:var(--blue-400)}
.bulk-tier.on{border-color:var(--blue-600);background:var(--blue-50,var(--blue-50));box-shadow:var(--sh)}
[data-theme="dark"] .bulk-tier.on{background:rgba(23,87,200,.16)}
.bt-qty{font-size:var(--fs-1);font-weight:700;color:var(--slate-500)}
.bt-price{font-size:var(--fs-4);font-weight:800;color:var(--ink);font-family:var(--mono);letter-spacing:-.01em}
.bt-save{position:absolute;top:8px;right:10px;font-size:var(--fs-1);font-weight:800;color:var(--accent);background:rgba(14,74,198,.12);border-radius:var(--r-sm);padding:2px 6px}
/* price on request */
.por-block{padding:18px 20px;background:linear-gradient(135deg,var(--bg-2) 0%,var(--bg) 100%);border:1.5px dashed var(--blue-400);border-radius:var(--r);margin-bottom:16px}
.por-label{display:flex;align-items:center;gap:8px;font-size:var(--fs-7);font-weight:900;letter-spacing:-.02em;color:var(--blue-700)}
.por-note{font-size:var(--fs-3);color:var(--slate-500);margin-top:6px;line-height:1.45;font-weight:500}
[data-theme="dark"] .por-label{color:var(--blue-500)}
.theme-toggle{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg-2);border:1px solid var(--line);color:var(--slate-600);font-size:var(--fs-4);cursor:pointer;transition:.15s;flex-shrink:0;line-height:1;padding:0}
.theme-toggle:hover{background:var(--blue-600);color:#fff;border-color:transparent}

/* ===== ТЁМНАЯ ТЕМА ===== */
[data-theme="dark"]{
  --ink:var(--line);
  --slate-700:#aabcce;
  --slate-600:var(--slate-300);
  --slate-500:#7e96ad;
  --slate-400:#6b86a0;
  --line:var(--navy-800);
  --line-soft:var(--navy-850);
  --bg:var(--navy-900);
  --bg-2:var(--navy-900);
  --surface:var(--navy-850);
  --navy-900:#040c18;
  --navy-850:var(--navy-900);
  --navy-800:var(--navy-900);
  --navy-700:var(--navy-850);
  --grad-hero:linear-gradient(160deg,var(--navy-900) 0%,var(--navy-900) 45%,#09162200 100%);
  color-scheme:dark;
}
[data-theme="dark"] body{background:var(--bg) !important;color:var(--ink)}
/* Белые фоны → поверхность */
[data-theme="dark"] .ubar,[data-theme="dark"] .foot-pay span{background:var(--surface)}
[data-theme="dark"] .lang{background:var(--bg-2);border-color:var(--line)}
[data-theme="dark"] .mega,[data-theme="dark"] .search-drop{background:var(--surface);border-color:var(--line)}
[data-theme="dark"] .search:focus-within{background:var(--surface)}
[data-theme="dark"] .mega-cta{background:var(--bg-2)}
[data-theme="dark"] .mega-list{background:var(--bg)}
/* Карточки */
[data-theme="dark"] .pcard,[data-theme="dark"] .dir-group-tile,[data-theme="dark"] .rev-card,
[data-theme="dark"] .kit-card,[data-theme="dark"] .track-card,[data-theme="dark"] .news-card,
[data-theme="dark"] .nhg-card,[data-theme="dark"] .info-side-card,[data-theme="dark"] .hero-form,
[data-theme="dark"] .brand-chip,[data-theme="dark"] .trust-it{background:var(--surface);border-color:var(--line)}
/* Карточки товаров и прочие белые поверхности */
[data-theme="dark"] .card,[data-theme="dark"] .qty,[data-theme="dark"] .tool,
[data-theme="dark"] .pdp-buy,[data-theme="dark"] .pdp-icact,[data-theme="dark"] .cmpbar,
[data-theme="dark"] .modal,[data-theme="dark"] .cart-items,[data-theme="dark"] .cart-sum,
[data-theme="dark"] .icc,[data-theme="dark"] .acc-login-card,[data-theme="dark"] .acc-side,
[data-theme="dark"] .acc-main,[data-theme="dark"] .pl-table-wrap,[data-theme="dark"] .dir-card,
[data-theme="dark"] .info-stat,[data-theme="dark"] .hero-card,[data-theme="dark"] .hc-tile,
[data-theme="dark"] .modal-close{background:var(--surface);border-color:var(--line)}
[data-theme="dark"] .btn-buy{background:var(--bg-2);border-color:var(--line)}
[data-theme="dark"] .dir-card-img{background:linear-gradient(135deg,var(--bg-2),var(--surface))}
/* Боковые панели, фильтры */
[data-theme="dark"] .filters,[data-theme="dark"] .pdp-variants,[data-theme="dark"] .tab-body,
[data-theme="dark"] .cart-layout,[data-theme="dark"] .cmp-table{background:transparent}
[data-theme="dark"] .flt-grp{border-color:var(--line)}
[data-theme="dark"] .chk{color:var(--ink)}
[data-theme="dark"] .chk .box{border-color:var(--line);background:var(--bg-2)}
/* Кнопки */
[data-theme="dark"] .pv-opt:not(.on),[data-theme="dark"] .calc-type-btn:not(.on),
[data-theme="dark"] .calc-level-btn:not(.on),[data-theme="dark"] .btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
[data-theme="dark"] .btn-ghost:hover{background:var(--bg-2)}
[data-theme="dark"] .btn-dark{background:var(--navy-700)}
/* Инпуты */
[data-theme="dark"] input:not([type=range]),[data-theme="dark"] textarea,[data-theme="dark"] select,
[data-theme="dark"] .hf-input,[data-theme="dark"] .adm-inp,[data-theme="dark"] .search input,
[data-theme="dark"] .field-input{background:var(--bg-2);color:var(--ink);border-color:var(--line)}
[data-theme="dark"] input::placeholder,[data-theme="dark"] textarea::placeholder{color:var(--slate-400)}
/* Таблица спецификаций */
[data-theme="dark"] .spec-table tr{border-color:var(--line)}
[data-theme="dark"] .spec-table tr:nth-child(even){background:var(--bg-2)}
/* Дропдаун поиска */
[data-theme="dark"] .sd-item:hover{background:var(--bg-2)}
[data-theme="dark"] .sd-sep{background:var(--line)}
/* Хлебные крошки */
[data-theme="dark"] .crumb a{color:var(--slate-500)}
/* Сортировка, чипсы */
[data-theme="dark"] .chip{background:var(--bg-2);border-color:var(--line);color:var(--ink)}
[data-theme="dark"] .sort-sel select{background:var(--surface);color:var(--ink);border-color:var(--line)}
/* Плавающие виджеты */
[data-theme="dark"] .hero-float{background:var(--surface);border-color:var(--line);color:var(--ink)}
/* hero light base → dark base in dark theme; ribbon glows even better on dark */
[data-theme="dark"] .hero{background:linear-gradient(180deg,var(--navy-900) 0%,var(--bg) 60%,var(--bg) 100%)}
[data-theme="dark"] .hero-base-fade{background:radial-gradient(85% 70% at 22% 48%,rgba(10,24,37,.7) 0%,rgba(10,24,37,.25) 40%,transparent 62%),linear-gradient(180deg,transparent 60%,var(--bg) 100%)}
[data-theme="dark"] .hero-wave-canvas{opacity:1}
[data-theme="dark"] .hero-kicker{background:rgba(18,32,48,.6);border-color:var(--line);color:var(--blue-400)}
[data-theme="dark"] .hero-video-slot{background:linear-gradient(150deg,#0e1e34,#0a1628);border-color:var(--line)}
/* Каталог-тайлы */
[data-theme="dark"] .cat-tile{background:var(--surface);border-color:var(--line)}
[data-theme="dark"] .mega-sub{color:var(--ink)}
[data-theme="dark"] .mega-sub:hover{background:var(--bg);border-color:var(--line)}
/* Бренды */
[data-theme="dark"] .bc-name{color:var(--ink)}
/* Тост */
[data-theme="dark"] .toast{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:0 8px 32px rgba(0,0,0,.5)}
/* Модалки */
[data-theme="dark"] .modal-box,[data-theme="dark"] .quote-box,[data-theme="dark"] .cmp-modal{background:var(--surface);border-color:var(--line)}
/* Мобильный дровер */
[data-theme="dark"] .mob-drawer{background:var(--surface)}
[data-theme="dark"] .mob-cat-item:hover,[data-theme="dark"] .mob-nav-item:hover{background:var(--bg-2)}
/* Вкладки */
[data-theme="dark"] .tab{color:var(--slate-500)}
[data-theme="dark"] .tab.on{color:var(--blue-500);border-color:var(--blue-500)}
[data-theme="dark"] .tab:hover:not(.on){background:var(--bg-2);color:var(--ink)}
/* Изображения и видео — без искажений */
[data-theme="dark"] img,[data-theme="dark"] video,[data-theme="dark"] .brand-logo,
[data-theme="dark"] .product-img,[data-theme="dark"] .pdp-main-img img{filter:none !important}
/* Calc */
[data-theme="dark"] .calc-result{background:var(--bg-2);border-color:var(--line)}
/* Кнопка темы — солнце в тёмной */
[data-theme="dark"] .theme-toggle{background:var(--bg-2);border-color:var(--line);color:#f5c842}

/* ===== sticky compact header ===== */
.sticky-bar{position:fixed;top:0;left:0;right:0;z-index:500;background:var(--surface);box-shadow:var(--sh-lg);transform:translateY(-100%);opacity:0;transition:transform .32s cubic-bezier(.16,1,.3,1),opacity .25s ease;pointer-events:none}
.sticky-bar.on{transform:translateY(0);opacity:1;pointer-events:auto}
.sticky-bar .wrap{display:flex;align-items:center;gap:14px;height:62px;position:relative}
.sb-brand{display:flex;align-items:center;cursor:pointer;flex-shrink:0}
.sb-brand .brand-logo-img{height:30px;width:auto}
.sb-cat{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border:none;border-radius:var(--r-sm);background:var(--blue-600);color:#fff;font-size:var(--fs-3);font-weight:700;cursor:pointer;flex-shrink:0;transition:background .15s}
.sb-cat:hover,.sb-cat.open{background:var(--blue-700)}
.sb-cat svg{color:#fff}
.sb-cats{display:flex;align-items:center;gap:2px}
.sb-cats .nav-dd a{padding:7px 10px;border-radius:var(--r-sm);font-size:var(--fs-3);font-weight:600;color:var(--slate-600);white-space:nowrap;cursor:pointer}
.sb-cats .nav-dd a:hover,.sb-cats .nav-dd a.dd-open{color:var(--blue-600);background:var(--bg)}
.sb-cats .nav-dd a.on{color:var(--blue-700)}
.sb-search{flex:1;min-width:120px;display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-sm);color:var(--slate-400)}
.sb-search input{flex:1;border:none;background:none;outline:none;font-size:var(--fs-4);color:var(--ink);min-width:0}
.sb-search:focus-within{border-color:var(--blue-400,#6ea8fe);background:var(--surface)}
.sb-actions{display:flex;align-items:center;gap:4px;flex-shrink:0}
.sb-ic{position:relative;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:none;background:none;border-radius:var(--r-sm);color:var(--slate-600);cursor:pointer;transition:background .15s,color .15s}
.sb-ic:hover{background:var(--bg);color:var(--blue-600)}
.sb-ic.has{color:var(--blue-600)}
.sb-cnt{position:absolute;top:4px;right:4px;min-width:16px;height:16px;padding:0 4px;display:flex;align-items:center;justify-content:center;font-size:var(--fs-1);font-weight:800;line-height:1;color:#fff;background:var(--blue-500);border-radius:99px}
.sb-div{width:1px;height:24px;background:var(--line);margin:0 4px}
.sb-lang{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.sb-lang button{border:none;background:none;padding:6px 8px;font-size:var(--fs-1);font-weight:700;color:var(--slate-500);cursor:pointer;transition:background .12s,color .12s}
.sb-lang button.on{background:var(--blue-600);color:#fff}
.sb-lang button:not(.on):hover{background:var(--bg)}
@media(max-width:1080px){.sb-cats{display:none}}
@media(max-width:860px){.sticky-bar{display:none}}
.nav-dd{display:inline-flex;align-items:center}
.catmega{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:200;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-xl);animation:navDdFade .16s ease}
.catmega-inner{max-width:var(--maxw);margin:0 auto;padding:20px 24px}
@keyframes navDdFade{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.catmega-head{display:flex;align-items:center;gap:10px;padding-bottom:13px;margin-bottom:8px}
.catmega-ic{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:var(--r-sm);background:var(--blue-50);color:var(--blue-600)}
.catmega-title{font-size:var(--fs-4);font-weight:800;color:var(--slate-900)}
.catmega-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px 28px}
.catmega-item{display:flex;align-items:flex-start;gap:7px;padding:9px 8px;font-size:var(--fs-3);line-height:1.3;color:var(--slate-700);cursor:pointer;text-decoration:none;border-radius:var(--r-sm);transition:background .12s,color .12s}
.catmega-item>span{min-width:0;overflow-wrap:anywhere}
.catmega-item:hover{background:var(--bg-2);color:var(--blue-600)}
.catmega-item .cmi-chev{color:var(--slate-300);flex-shrink:0;margin-top:3px;transition:color .12s,transform .12s}
.catmega-item:hover .cmi-chev{color:var(--blue-600);transform:translateX(2px)}
.catmega-all{display:block;margin-top:12px;padding-top:12px;font-size:var(--fs-3);font-weight:700;color:var(--blue-600);cursor:pointer;text-decoration:none}
.catmega-all:hover{color:var(--blue-700)}
.nav-links .nav-dd a.dd-open{color:var(--blue-700);background:var(--bg)}
/* hover bridge: prevents flicker crossing the gap between label and dropdown */
.catmega::before{content:"";position:absolute;top:-8px;left:0;right:0;height:8px}
.catmega-grid+.catmega-all{margin-top:8px}
@media(max-width:1100px){.catmega-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:680px){.catmega-grid{grid-template-columns:1fr}}
/* ===== catalog: direction sections + product-group tiles ===== */
.cat-sections{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.cat-sec-chip{padding:7px 14px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--surface);font-size:var(--fs-3);font-weight:600;color:var(--slate-600);cursor:pointer;transition:all .13s}
.cat-sec-chip:hover{border-color:var(--blue-400);color:var(--blue-600)}
.cat-sec-chip.on{background:var(--blue-600);border-color:var(--blue-600);color:#fff}
.cat-groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.cat-group-tile{display:flex;align-items:center;gap:11px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left;cursor:pointer;transition:border-color .14s,box-shadow .14s,transform .14s}
.cat-group-tile:hover{border-color:var(--blue-400);box-shadow:var(--sh-lg);transform:translateY(-2px)}
.cat-group-tile .cgt-ic{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:var(--r-sm);background:var(--blue-50);color:var(--blue-600);flex-shrink:0}
.cat-group-tile .cgt-name{flex:1;min-width:0;font-size:var(--fs-4);font-weight:600;color:var(--slate-800);line-height:1.3}
.cat-group-tile .cgt-chev{color:var(--slate-300);flex-shrink:0;transition:color .14s,transform .14s}
.cat-group-tile:hover .cgt-chev{color:var(--blue-600);transform:translateX(2px)}
/* ===== full-width grouped directions mega ===== */
.mega-cols{max-width:var(--maxw);margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:0 28px;padding:26px 24px 22px}
.mega-col{min-width:0}
.mega-col-h{font-size:var(--fs-2);font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--blue-700);padding-bottom:10px;margin-bottom:6px}
.mega-col-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.mega-glink{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:var(--r-sm);font-size:var(--fs-3);font-weight:600;color:var(--slate-700);cursor:pointer;text-decoration:none;transition:background .13s,color .13s}
.mega-glink:hover{background:var(--bg-2);color:var(--blue-600)}
.mega-glink .mgl-chev{color:var(--slate-300);flex-shrink:0;transition:color .13s,transform .13s}
.mega-glink:hover .mgl-chev{color:var(--blue-600);transform:translateX(2px)}
.mega-foot{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:16px;padding:16px 24px;background:linear-gradient(115deg,var(--blue-50),var(--line-soft))}
.mega-foot-txt{display:flex;align-items:center;gap:10px;font-size:var(--fs-4);font-weight:700;color:var(--ink)}
.mega-foot .btn{margin-left:auto}
@media(max-width:1100px){.mega-cols{grid-template-columns:repeat(2,1fr);gap:8px 24px}}
@media(max-width:680px){.mega-cols{grid-template-columns:1fr}}
.doc-overlay{position:fixed;inset:0;z-index:4000;background:rgba(9,24,48,.62);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:32px;animation:docFade .18s ease}
@keyframes docFade{from{opacity:0}to{opacity:1}}
.doc-modal{width:min(920px,100%);height:min(90vh,100%);background:var(--surface);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh-xl);animation:docPop .2s cubic-bezier(.2,.8,.3,1)}
@keyframes docPop{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.doc-modal-bar{display:flex;align-items:center;gap:14px;padding:13px 16px;flex-shrink:0}
.doc-modal-title{flex:1;font-size:var(--fs-4);font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-modal-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
.doc-modal-dl{font-size:var(--fs-3);font-weight:700;color:var(--blue-600);text-decoration:none;padding:7px 14px;border:1.5px solid var(--blue-600);border-radius:var(--r-sm);transition:background .15s,color .15s}
.doc-modal-dl:hover{background:var(--blue-600);color:#fff}
.doc-modal-close{width:34px;height:34px;border:none;background:var(--bg-2);border-radius:var(--r-sm);font-size:var(--fs-7);line-height:1;color:var(--slate-600);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.doc-modal-close:hover{background:var(--line)}
.doc-modal-body{flex:1;position:relative;background:var(--bg-2);display:flex;align-items:center;justify-content:center;min-height:0}
.doc-modal-body iframe,.doc-modal-body embed{width:100%;height:100%;border:0}
.doc-canvas{display:block;max-width:100%;height:auto;margin:0 auto}
.doc-modal-body{overflow-y:auto;align-items:flex-start;padding:16px}
.doc-modal-prev,.doc-modal-next{width:30px;height:30px;border:none;background:var(--bg-2);border-radius:var(--r-sm);font-size:var(--fs-5);cursor:pointer;color:var(--slate-600);display:flex;align-items:center;justify-content:center;transition:background .15s}
.doc-modal-prev:hover,.doc-modal-next:hover{background:var(--line)}
.doc-modal-page{font-size:var(--fs-3);color:var(--slate-500);min-width:50px;text-align:center}
.doc-modal-spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--blue-600);border-radius:50%;animation:spin .8s linear infinite}
.doc-modal-err{text-align:center;font-size:var(--fs-4);color:var(--slate-600);line-height:1.7}
.doc-modal-err a{color:var(--blue-600);font-weight:700}
@media(max-width:620px){.doc-overlay{padding:0}.doc-modal{width:100%;height:100%;border-radius:0}.doc-modal-dl{padding:6px 10px}}

/* ===== embed mode (catalog inside soi.uz host shell) ===== */
/* unified header (variant 3): the corp host header provides logo + search + lang/theme + cart.
   So inside the embedded catalog we hide its own utility bar AND its commercial header,
   keeping only the category Nav as the "middle row". */
.embed .ubar{display:none!important}
.embed .head{display:none!important}
.embed .sb-brand{display:none!important}
/* seamless: catalog reads as a section of soi.uz, not a separate site */
.embed{background:var(--bg)}
.embed body{background:var(--bg)}
.embed .sticky-bar{display:none!important}
/* category nav becomes the catalog's middle row, sits right under the host header */
.embed .nav{position:static!important;box-shadow:var(--sh-sm)}
.embed .z-catalog .nav{display:block!important;background:rgba(255,255,255,.985)!important;box-shadow:var(--sh-sm)}
.embed .z-catalog .nav .wrap{height:60px;gap:10px;overflow-x:auto;overflow-y:visible;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.embed .z-catalog .nav .wrap::-webkit-scrollbar{display:none}
.embed .z-catalog .nav-links{display:flex!important;align-items:center;gap:6px;min-width:max-content}
.embed .z-catalog .nav-links a{height:42px;display:inline-flex;align-items:center;padding:0 13px;border:1px solid transparent;border-radius:var(--r-sm);color:var(--slate-600);background:transparent;font:700 14px/1 var(--font);white-space:nowrap}
.embed .z-catalog .nav-links a:hover{color:var(--blue-700);background:var(--bg-2);border-color:var(--line-soft)}
.embed .z-catalog .nav-links a.on{color:var(--blue-700);background:var(--blue-50);border-color:var(--line-soft);font-weight:800}
.embed .z-catalog .cat-btn{height:44px;padding:0 18px;border-radius:var(--r-sm);background:var(--blue-600);border:1px solid var(--blue-600);box-shadow:var(--sh-lg);font:800 14px/1 var(--font)}
.embed .z-catalog .cat-btn:hover,.embed .z-catalog .cat-btn.open{background:var(--blue-700);border-color:var(--blue-700)}
.embed .z-catalog .nav-more-btn{height:42px;border:1px solid transparent;border-radius:var(--r-sm);color:var(--slate-600);font:700 14px/1 var(--font)}
.embed .z-catalog .nav-more-btn:hover,.embed .z-catalog .nav-more-btn.open{color:var(--blue-700);background:var(--bg-2);border-color:var(--line-soft)}
.embed .z-catalog .nav-more-dd{min-width:216px;border-color:rgba(15,23,42,.10);box-shadow:var(--sh-xl)}
/* …но КОРПОРАТИВНАЯ шапка (прямой потомок .z-corp) должна остаться sticky со своим stacking-
   контекстом: иначе .embed .nav сбрасывал её в static, z-index:100 переставал работать и
   выпадающие меню «О компании»/«Услуги» проваливались под hero (задача №9). Каталожная
   category-nav лежит внутри .z-catalog и этим правилом не затрагивается. */
.z-corp > nav.nav{position:sticky!important;top:env(safe-area-inset-top,0px);z-index:890!important}

/* ===== corporate header polish: fixed menu bar + dropdown layering ===== */
.z-corp{--soi-head-h:calc(72px + env(safe-area-inset-top,0px));padding-top:var(--soi-head-h)}
.z-corp > nav.nav.co-nav{display:block!important;position:fixed!important;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:900!important;background:rgba(255,255,255,.97);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);box-shadow:var(--sh-sm);border-bottom:1px solid var(--line);transition:background .22s ease,box-shadow .22s ease,border-color .22s ease}
.z-corp > nav.nav.co-nav.scrolled{background:rgba(255,255,255,.985);border-bottom-color:rgba(190,205,226,.95);box-shadow:var(--sh-lg)}
.z-corp .co-nav .co-nav-wrap{position:relative;height:72px;gap:18px;transition:height .22s ease,gap .22s ease}
.z-corp .co-nav.scrolled .co-nav-wrap{height:62px;gap:16px}
.z-corp .co-nav .co-brand{height:52px;width:52px;justify-content:center;transition:width .22s ease,height .22s ease}
.z-corp .co-nav.scrolled .co-brand{height:46px;width:46px}
.z-corp .co-nav .co-brand-mark{width:50px;height:50px;object-fit:contain;transition:width .22s ease,height .22s ease,filter .18s ease}
.z-corp .co-nav.scrolled .co-brand-mark{width:44px;height:44px}
.z-corp .co-nav .co-nav-links{display:flex;align-items:center;gap:8px;margin-left:4px;min-width:0}
.z-corp .co-nav .nav-dd{position:relative;display:inline-flex;align-items:center;height:42px}
/* Цвет сведён к --slate-600 — тому же токену, что у языка/темы/иконок справа
   (09.08.2026): раньше пункты меню были на тон темнее и холоднее (--navy-700),
   и строка читалась как два разных цвета текста без функциональной причины. */
.z-corp .co-nav .co-nav-links>a,
.z-corp .co-nav .nav-dd-btn{height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;border:1px solid transparent;border-radius:var(--r-sm);background:transparent;color:var(--slate-600);font-family:var(--font);font-size:var(--fs-4);font-weight:700;line-height:1;white-space:nowrap;cursor:pointer;transition:background .15s,color .15s,border-color .15s,box-shadow .15s,transform .15s}
.z-corp .co-nav .co-nav-links>a:hover,
.z-corp .co-nav .nav-dd-btn:hover,
.z-corp .co-nav .nav-dd-btn.on{background:var(--bg-2);border-color:var(--line-soft);color:var(--blue-700);box-shadow:var(--sh-sm)}
.z-corp .co-nav .co-nav-links>a:active,
.z-corp .co-nav .nav-dd-btn:active{transform:scale(.98)}
.z-corp .co-nav .co-nav-links>a.on{background:var(--bg-2);border-color:var(--line-soft);color:var(--blue-700)}
.z-corp .co-nav .co-nav-links>a.nav-primary{background:var(--bg-2);border-color:var(--line-soft);color:var(--blue-700);font-weight:800;box-shadow:var(--sh-lg)}
.z-corp .co-nav .co-nav-links>a.nav-primary:hover{background:var(--blue-600);border-color:var(--blue-600);color:#fff;box-shadow:var(--sh-lg)}
.z-corp .co-nav .nav-dd-chevron,
.z-corp .co-nav .lang-dd-chevron{font-size:14px;line-height:1;opacity:1;transition:transform .16s ease,opacity .16s ease}
.z-corp .co-nav .nav-dd-btn.on .nav-dd-chevron,
.z-corp .co-nav .lang-dd-btn[aria-expanded="true"] .lang-dd-chevron{transform:rotate(180deg);opacity:1}
.z-corp .co-nav .nav-dd-menu,
.z-corp .co-nav .lang-dd-menu{position:absolute;top:calc(100% + 10px);z-index:940;background:var(--surface,#fff);border:1px solid rgba(15,23,42,.10);border-radius:var(--r);box-shadow:var(--sh-xl);padding:7px;animation:navDdFade .15s ease;overflow:hidden}
.z-corp .co-nav .nav-dd-menu{left:0;min-width:272px}
.z-corp .co-nav .lang-dd-menu{right:0;min-width:184px}
.z-corp .co-nav .nav-dd-menu::before,
.z-corp .co-nav .lang-dd-menu::before{content:"";position:absolute;left:0;right:0;top:-10px;height:10px}
.z-corp .co-nav .nav-dd-item,
.z-corp .co-nav .lang-dd-item{width:100%;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 12px;border:0;border-radius:var(--r-sm);background:transparent;color:var(--slate-700);font-family:var(--font);font-size:var(--fs-4);font-weight:650;line-height:1.25;text-align:left;cursor:pointer;transition:background .13s,color .13s}
.z-corp .co-nav .nav-dd-item:hover,
.z-corp .co-nav .lang-dd-item:hover,
.z-corp .co-nav .lang-dd-item.on{background:var(--blue-50);color:var(--blue-700)}
.z-corp .co-nav .lang-dd-item>span:last-child{font-size:var(--fs-1);font-weight:800;color:var(--slate-400)}
/* 4px → 8px: значки почти соприкасались, целиться пальцем/курсором в один
   из двух было неудобно (09.08.2026). */
.z-corp .co-nav .nav-utils{display:inline-flex;align-items:center;gap:8px;flex-shrink:0}
.z-corp .co-nav .lang-dd{position:relative;display:inline-flex;align-items:center}
/* Цвет сведён к тому же токену, что у пунктов меню и иконок корзины/избранного
   (--slate-600) — раньше здесь стоял --navy-700, чуть темнее и холоднее, и на
   общей строке из пяти элементов два выделялись оттенком без причины. */
.z-corp .co-nav .lang-dd-btn,
.z-corp .co-nav .theme-btn{height:40px;min-width:40px;display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:var(--r-sm);background:transparent;color:var(--slate-600);cursor:pointer;transition:background .15s,color .15s,border-color .15s,transform .15s}
.z-corp .co-nav .lang-dd-btn{gap:7px;padding:0 11px;font-family:var(--font);font-size:var(--fs-4);font-weight:700}
/* Без рамки в любом состоянии (09.08.2026): обратную связь при наведении даёт
   только подложка. Прозрачная рамка в базовом правиле оставлена — она держит
   габарит, чтобы кнопка не дёргалась на 2px, но цвет ей больше не задаётся. */
.z-corp .co-nav .lang-dd-btn:hover,
.z-corp .co-nav .theme-btn:hover{background:var(--blue-50);color:var(--blue-700)}
.z-corp .co-nav .theme-btn{font-size:var(--fs-5)}
.z-corp .co-nav .nav-sep{width:1px;height:24px;background:var(--line-soft);margin:0 2px;flex-shrink:0}
.z-corp .co-nav .co-actions{gap:8px}
.z-corp .co-nav .co-act{width:40px;height:40px;border-radius:var(--r-pill);transition:width .18s ease,height .18s ease,background .15s,color .15s,transform .15s,border-color .15s}
.z-corp .co-nav .co-act:active{transform:scale(.97)}
.z-corp .co-nav.scrolled .co-act{width:38px;height:38px}
.z-corp .drawer{visibility:hidden;pointer-events:none;transition:transform .28s cubic-bezier(.16,1,.3,1),visibility 0s linear .28s}
.z-corp .drawer.on{visibility:visible;pointer-events:auto;transition:transform .28s cubic-bezier(.16,1,.3,1)}
.z-corp .drawer .lang-dd{position:relative}
.z-corp .drawer .lang-dd-menu{position:absolute;top:calc(100% + 8px);left:0;right:auto;z-index:940;min-width:184px;background:var(--surface,#fff);border:1px solid rgba(15,23,42,.10);border-radius:var(--r);box-shadow:var(--sh-xl);padding:7px}
.z-corp .drawer .lang-dd-btn{height:40px;display:inline-flex;align-items:center;gap:7px;padding:0 11px;border:1px solid var(--line-soft);border-radius:var(--r-sm);background:var(--surface,#fff);font-size:var(--fs-4);font-weight:700;color:var(--slate-700)}
.z-corp .drawer .lang-dd-item{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:0;border-radius:var(--r-sm);background:transparent;color:var(--slate-700);font-family:var(--font);font-size:var(--fs-4);font-weight:650;text-align:left}
.z-corp .drawer .lang-dd-item:hover,.z-corp .drawer .lang-dd-item.on{background:var(--blue-50);color:var(--blue-700)}

@media(max-width:620px){
  .z-corp{--soi-head-h:calc(62px + env(safe-area-inset-top,0px))}
  .z-corp .co-nav .co-nav-wrap{height:64px;display:grid;grid-template-columns:42px 40px minmax(82px,1fr);align-items:center;column-gap:8px;row-gap:0}
  .z-corp .co-nav.scrolled .co-nav-wrap{height:58px;gap:10px}
  .z-corp .co-nav .co-brand{width:42px;height:42px}
  .z-corp .co-nav .co-brand-mark{width:42px;height:42px}
  .z-corp .co-nav.scrolled .co-brand,.z-corp .co-nav.scrolled .co-brand-mark{width:40px;height:40px}
  .z-corp .co-nav .nav-sp{display:none}
  .z-corp .co-nav .co-brand{order:1}
  .z-corp .co-nav .co-cat-search{order:2;justify-self:start}
  .z-corp .co-nav .co-mobile-actions{order:3;justify-self:end;margin-left:0;display:flex;align-items:center;gap:6px}
  .z-corp .co-nav .nav-utils{display:none}
  /* On mobile the header collapses to logo/search/cart/burger — the consult
     pill has no slot in that grid and would sit on top of the logo. It moves
     into the drawer (.drawer-cta) instead, so it stays reachable. */
  .z-corp .co-nav .nav-cta{display:none}
  .z-corp .co-nav .co-actions{order:4;margin-left:auto}
  .z-corp .co-nav .burger{order:5}
  .z-corp .co-nav .lang-dd-btn{min-width:38px;height:38px;padding:0 7px;gap:0;font-size:var(--fs-3)}

  .z-corp .co-nav .theme-btn{display:none}
  /* На каталоге кнопки корзины/меню уже даёт .co-mobile-actions — обычные
     .co-actions и .burger там дублируют их и скрываются. На остальных
     страницах .co-mobile-actions не рендерится вовсе, поэтому burger и
     корзина — единственный способ открыть меню и остаются видимыми. */
  .z-corp .co-nav-wrap:has(.co-mobile-actions) .co-actions{position:static;right:auto;top:auto;display:none!important;gap:0;transform:none;z-index:955}
  .z-corp .co-nav .co-act.co-act-cart{display:flex!important}
  .z-corp .co-nav-wrap:has(.co-mobile-actions) .burger{position:static;right:auto;top:auto;display:none!important;transform:none;z-index:955}
  .z-corp .co-nav .co-actions{position:static;right:auto;top:auto;gap:0;transform:none;z-index:955}
  .z-corp .co-nav .burger{position:static;right:auto;top:auto;transform:none;z-index:955}
  .z-corp .co-nav .co-act{width:36px;height:38px}
  .z-corp .burger{width:38px;height:38px;border-radius:var(--r-sm)}
  .z-corp .co-cat-search-trigger{width:40px;height:40px}
  .z-corp .co-cat-search.open{grid-column:1 / -1;position:absolute;left:12px;right:12px;top:50%;z-index:960;min-width:0;width:auto;justify-self:stretch;transform:translateY(-50%)}
  .z-corp .co-cat-search.open .co-cat-search-expanded{height:48px}
  .z-corp .co-cat-search-expanded input{font-size:var(--fs-5)}
  .embed .z-catalog .nav .wrap{height:52px}

/* breadcrumbs (catalog section of soi.uz) */
.crumbs{background:var(--surface)}
.crumbs .wrap{display:flex;align-items:center;gap:9px;padding-top:11px;padding-bottom:11px;font-size:var(--fs-3);flex-wrap:wrap}
/* hide local .crumb divs in embed mode — global <Breadcrumbs> handles them */
.embed .crumb{display:none!important}
.crumb-sep{color:var(--slate-400)}
.crumb-lnk{color:var(--slate-600);font-weight:600;cursor:pointer;transition:color .15s}
.crumb-lnk:hover{color:var(--blue-600)}
.crumb-cur{color:var(--ink);font-weight:700}
[data-theme="dark"] .crumbs{background:var(--surface);border-color:var(--line)}
/* breadcrumbs (корпоративная оболочка) */
.z-corp .co-crumbs .wrap{padding-top:20px;padding-bottom:0}
.co-crumbs-list{display:flex;align-items:center;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0;font-size:var(--fs-4);font-family:var(--font)}
.co-crumbs-list li{display:inline-flex;align-items:center;gap:6px}
.co-crumb-lnk{color:var(--slate-400);cursor:pointer;font-weight:400;transition:color .13s}
.co-crumb-lnk:hover{color:#6f9600}
.co-crumb-cur{color:#374151;font-weight:400}
.co-crumb-sep{color:var(--slate-400)}
/* мобильные крошки: одна строка с горизонтальной прокруткой, не ломают вёрстку */
@media (max-width:720px){
  .crumbs .wrap,.co-crumbs-list{flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .crumbs .wrap::-webkit-scrollbar,.co-crumbs-list::-webkit-scrollbar{display:none}
  .crumb-cur,.co-crumb-cur{max-width:60vw;overflow:hidden;text-overflow:ellipsis}
}

/* NVIDIA-restyle шапки (тёмная плавающая стеклянная панель) снята 09.08.2026
   по прямому запросу — воспроизвести форму бар-меню из примера readdy.cc:
   сплошная светлая полупрозрачная полоса на всю ширину, без плавающей
   тёмной панели. Снятие блока не требует замены: под ним уже лежал рабочий
   светлый вариант шапки (правила выше в этом файле — .co-nav фон/тень/бордер,
   .nav-links a, .nav-primary, .co-act, .lang-dd-btn и т.д.), написанный до
   того, как сюда наложили тёмное стекло, и уже учитывающий тёмную тему сайта
   через свои собственные [data-theme="dark"] правила. Он просто снова
   стал видимым. */

/* ============================================================
   Прозрачная шапка над hero главной (09.08.2026): пока пользователь не
   проскроллил и виден тёмный фото-hero, бар прозрачный и белый — как в
   readdy.cc. На любой другой странице и после скролла хедер остаётся тем,
   каким он был до этого блока (сплошной светлый) — там за шапкой светлый
   фон (.page-hero), и белый текст на нём был бы нечитаем.
   Класс .home-top ставится в CoHeader (certificates.jsx) только когда
   route.view === "home" && !scrolled.
   ============================================================ */
.z-corp .co-nav.home-top{
  background:transparent!important;border-bottom-color:transparent!important;
  box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.z-corp .co-nav.home-top .co-brand-mark{filter:brightness(0) invert(1)}
.z-corp .co-nav.home-top .co-nav-links>a,
.z-corp .co-nav.home-top .nav-dd-btn{color:rgba(255,255,255,.92)!important;background:transparent!important}
.z-corp .co-nav.home-top .co-nav-links>a:hover,
.z-corp .co-nav.home-top .nav-dd-btn:hover,
.z-corp .co-nav.home-top .nav-dd-btn.on,
.z-corp .co-nav.home-top .co-nav-links>a.on{background:rgba(255,255,255,.14)!important;color:#fff!important}
.z-corp .co-nav.home-top .nav-sep{background:rgba(255,255,255,.24)!important}
/* Язык и переключатель темы — без рамки и над hero тоже (09.08.2026):
   в обычном состоянии её у них нет, и белая обводка появлялась только здесь,
   из-за чего эти две кнопки выбивались из ряда. Круглые иконки (.co-act) и
   бургер рамку сохраняют — на фото без неё они теряются. */
.z-corp .co-nav.home-top .lang-dd-btn,
.z-corp .co-nav.home-top .theme-btn{color:rgba(255,255,255,.92)!important;border-color:transparent!important;background:transparent!important}
.z-corp .co-nav.home-top .co-act,
.z-corp .co-nav.home-top .burger{color:rgba(255,255,255,.92)!important;border-color:rgba(255,255,255,.35)!important;background:transparent!important}
.z-corp .co-nav.home-top .lang-dd-btn:hover,
.z-corp .co-nav.home-top .theme-btn:hover{background:rgba(255,255,255,.14)!important}
.z-corp .co-nav.home-top .co-act:hover{background:rgba(255,255,255,.14)!important;border-color:rgba(255,255,255,.5)!important}
/* «Консультация» — прозрачная пилюля с рамкой, а не сплошная синяя: сплошной
   синий на фото-hero не терялся бы, но и не читался бы как «то же самое,
   что после скролла» — по примеру readdy кнопка тоже становится обычной
   заливкой только на сплошном хедере. */
.z-corp .co-nav.home-top .nav-cta{background:rgba(255,255,255,.16)!important;color:#fff!important;border:1px solid rgba(255,255,255,.4)!important;box-shadow:none!important}
.z-corp .co-nav.home-top .nav-cta:hover{background:rgba(255,255,255,.26)!important}
/* Выпадающие меню остаются сплошными светлыми в любом состоянии шапки —
   открытая панель — самостоятельный слой над контентом, а не часть
   прозрачного бара, и белый текст на ней потерялся бы. */
